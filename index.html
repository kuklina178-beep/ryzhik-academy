<script>
  // Telegram Mini App bootstrap — added when porting "Академия Рыжика" from
  // a standalone Claude artifact into a Telegram Mini App. Safe no-op if the
  // page is ever opened outside Telegram (e.g. for local testing).
  (function(){
    var tg = window.Telegram && window.Telegram.WebApp;
    if(!tg) return;
    tg.ready();
    tg.expand();
    // The app is deliberately single-theme (bright picture-book look) even
    // in OS dark mode — see the CSS comment below. Match Telegram's chrome
    // to the app's own cream background instead of inheriting the client's
    // (possibly dark) theme colors.
    try{ tg.setHeaderColor('#F1F3FF'); }catch(e){}
    try{ tg.setBackgroundColor('#F1F3FF'); }catch(e){}
    // A 5-year-old's thumb will absolutely trigger Telegram's swipe-to-close
    // gesture mid-game — disable it so an accidental swipe doesn't dump
    // progress out of the trainer.
    try{ tg.disableVerticalSwipes(); }catch(e){}
    try{ tg.enableClosingConfirmation(); }catch(e){}
  })();
</script>

<title>Академия Рыжика</title>
<style>
  /* Deliberately single-theme: a bright, soft picture-book world for a
     5-year-old. Kept the same in light and dark OS mode on purpose — a
     bedtime-dark screen doesn't suit a daytime play-and-learn app. */
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap');

  :root{
    --bg-a:#EAF1FF;
    --bg-b:#FFF2E8;
    --card:#FFFFFF;
    --ink:#2E2A4A;
    --ink-soft:#6F6B8C;
    --coral:#FF7A66;
    --coral-deep:#E85B47;
    --sun:#FFB648;
    --sun-deep:#E89A1E;
    --leaf:#34C2A3;
    --leaf-deep:#22A387;
    --sky:#5AA9F0;
    --sky-deep:#3D8AD1;
    --berry:#E85D9E;
    --berry-deep:#C63F80;
    --dot-idle:#E7E3F5;
    --shadow-rgb:46,42,90;
  }

  *{box-sizing:border-box;}
  body{
    background:
      radial-gradient(circle at 12% 8%, rgba(255,182,72,.20), transparent 52%),
      radial-gradient(circle at 88% 12%, rgba(90,169,240,.22), transparent 52%),
      radial-gradient(circle at 50% 105%, rgba(232,93,158,.14), transparent 58%),
      linear-gradient(180deg, var(--bg-a), var(--bg-b));
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  h1,h2,h3,.display{font-family:'Baloo 2','Nunito',system-ui,sans-serif; text-wrap:balance;}
  button{font-family:inherit; cursor:pointer;}
  button:focus-visible, [tabindex]:focus-visible{outline:3px solid var(--sky-deep); outline-offset:3px;}

  #app{max-width:720px; margin:0 auto; padding:16px 16px 44px; min-height:100vh; display:flex; flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .stars-pill{display:flex; align-items:center; gap:6px; background:var(--card); border:none; border-radius:999px; padding:7px 16px 7px 12px; font-family:'Baloo 2'; font-weight:700; font-size:1.05rem; color:var(--ink); box-shadow:0 10px 22px -12px rgba(var(--shadow-rgb),.35), 0 1px 4px rgba(var(--shadow-rgb),.08); transition:transform .15s;}
  .stars-pill:active{transform:scale(.94);}
  .letter-choice-btn{font-family:'Baloo 2'; font-weight:800; font-size:2.4rem; color:var(--ink);}
  .info-modal-overlay{position:fixed; inset:0; background:rgba(46,42,90,.55); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px;}
  .info-modal-card{background:var(--card); border-radius:26px; padding:26px 22px; max-width:400px; width:100%; max-height:80vh; overflow-y:auto; text-align:center; box-shadow:0 24px 50px -20px rgba(0,0,0,.4);}
  .info-modal-card h3{font-family:'Baloo 2'; margin:6px 0 10px;}
  .info-modal-card p{font-weight:600; color:var(--ink); margin:0 0 8px; line-height:1.4;}
  .stars-pill .star-ic{font-size:1.2rem;}
  .icon-btn{background:var(--card); border:none; border-radius:999px; width:46px; height:46px; font-size:1.25rem; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 22px -12px rgba(var(--shadow-rgb),.35), 0 1px 4px rgba(var(--shadow-rgb),.08); transition:transform .15s, box-shadow .15s;}
  .icon-btn.active-mode{background:linear-gradient(155deg,var(--leaf),var(--leaf-deep)); color:#fff; box-shadow:0 0 0 3px var(--sun), 0 10px 22px -12px rgba(34,163,135,.5);}
  .icon-btn:active{transform:scale(.92); box-shadow:0 4px 10px -6px rgba(var(--shadow-rgb),.35);}
  .topbar-right{display:flex; gap:8px;}
  .topbar-mid{display:flex; align-items:center; gap:8px;}
  /* v61: по прямой просьбе пользователя - белый, в стиле игры (как
     .stars-pill), вместо чёрного "цифрового будильника". */
  .session-timer-pill{display:flex; align-items:center; gap:7px; background:var(--card); color:var(--ink); font-family:'Baloo 2'; font-weight:700; font-size:1.05rem; padding:7px 16px 7px 12px; border-radius:999px; border:none; box-shadow:0 10px 22px -12px rgba(var(--shadow-rgb),.35), 0 1px 4px rgba(var(--shadow-rgb),.08); font-variant-numeric:tabular-nums;}
  .session-timer-pill .stp-dot{width:7px; height:7px; border-radius:50%; background:var(--sky); flex:none;}
  .session-timer-pill.warn{color:var(--coral); animation:stpBlink 1s step-start infinite;}
  .session-timer-pill.warn .stp-dot{background:var(--coral);}
  @keyframes stpBlink{50%{opacity:.45;}}
  @media (max-width:380px){ .session-timer-pill{font-size:.9rem; padding:7px 11px;} }

  /* ---------- Mascot & speech (the whole row is tappable — replays the instruction aloud) ---------- */
  .mascot-row{display:flex; align-items:flex-end; gap:14px; margin:6px 0 20px; cursor:pointer; border:none; background:none; text-align:left; width:100%; padding:0;}
  .mascot-wrap{position:relative; width:78px; height:78px; flex:none;}
  .mascot-wrap::before{content:''; position:absolute; inset:8px 2px -6px 2px; background:radial-gradient(ellipse at center, rgba(255,182,72,.35), transparent 70%); filter:blur(4px); border-radius:50%;}
  .mascot{position:relative; width:100%; height:100%; animation:float 3.2s ease-in-out infinite; display:block;}
  .replay-badge{position:absolute; right:-2px; bottom:0; background:var(--sky); color:#fff; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.7rem; box-shadow:0 3px 8px rgba(var(--shadow-rgb),.35);}
  /* v96: по прямой просьбе пользователя - значок "повторить" на бейдже
     лисёнка был голым эмодзи 🔁 - заменён на уже готовую иконку проекта
     break_repeat (та же, что на кнопке "Повторить" после уровня/на
     переменке), ноль новых байт. */
  .replay-badge-img{width:60%; height:60%; object-fit:contain;}
  .bubble{background:var(--card); border-radius:20px 20px 20px 4px; padding:13px 17px; font-size:1.05rem; font-weight:700; color:var(--ink); box-shadow:0 10px 24px -14px rgba(var(--shadow-rgb),.4), 0 1px 4px rgba(var(--shadow-rgb),.06); flex:1;}

  /* ---------- Home ---------- */
  .home-title{font-size:clamp(1.7rem,5vw,2.2rem); font-weight:800; margin:0 0 2px;}
  .home-sub{color:var(--ink-soft); font-weight:600; margin:0 0 20px; font-size:.98rem;}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px;}
  .dcard{border:none; border-radius:28px; padding:22px 18px; text-align:center; color:#fff; display:flex; flex-direction:column; align-items:center; gap:8px; transition:transform .18s;}
  .dcard.dcard-disabled{opacity:.4; filter:grayscale(.7); box-shadow:none !important;}
  .dcard.dcard-disabled:active{transform:none;}
  .dcard:active{transform:scale(.97);}
  .dcard .dicon{width:64px; height:64px; object-fit:contain; filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));}
  .dcard .dicon.emoji-media{font-size:2.6rem;}
  .dcard .dtitle{font-family:'Baloo 2'; font-weight:700; font-size:1.3rem;}
  .dcard .ddesc{font-size:.88rem; opacity:.92; font-weight:600;}
  .dcard.c-read{background:linear-gradient(155deg,var(--coral),var(--coral-deep)); box-shadow:0 18px 34px -16px rgba(232,91,71,.65), 0 2px 8px rgba(232,91,71,.2);}
  .dcard.c-math{background:linear-gradient(155deg,var(--sun),var(--sun-deep)); box-shadow:0 18px 34px -16px rgba(219,150,12,.6), 0 2px 8px rgba(219,150,12,.2);}
  .dcard.c-write{background:linear-gradient(155deg,var(--leaf),var(--leaf-deep)); box-shadow:0 18px 34px -16px rgba(34,163,135,.6), 0 2px 8px rgba(34,163,135,.2);}
  .home-foot{margin-top:auto; padding-top:26px; text-align:center;}

  /* name onboarding */
  .ryzhik-note{max-width:340px; background:var(--card); border-radius:18px; padding:14px 18px; font-weight:700; color:var(--ink); box-shadow:0 10px 22px -14px rgba(var(--shadow-rgb),.3); margin:0;}

  .name-input{font-family:'Baloo 2'; font-weight:700; font-size:1.4rem; text-align:center; width:100%; max-width:280px; padding:14px 18px; border-radius:999px; border:3px solid var(--coral); background:var(--card); color:var(--ink); box-shadow:0 10px 22px -14px rgba(var(--shadow-rgb),.3);}
  .name-input:focus{outline:3px solid var(--sky-deep); outline-offset:2px;}

  /* day map (30-day curriculum path) */
  .day-map{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:14px; background:var(--card); border-radius:22px; box-shadow:0 12px 24px -16px rgba(var(--shadow-rgb),.3);}
  .day-dot{width:34px; height:34px; border-radius:50%; border:none; font-family:'Baloo 2'; font-weight:700; font-size:.85rem; display:flex; align-items:center; justify-content:center; background:rgba(var(--shadow-rgb),.1); color:var(--ink-soft);}
  .day-dot.current{background:linear-gradient(155deg,var(--coral),var(--coral-deep)); color:#fff; box-shadow:0 0 0 3px var(--sun); transform:scale(1.12);}
  .day-dot.done{background:linear-gradient(155deg,var(--leaf),var(--leaf-deep)); color:#fff;}
  .day-dot.locked{opacity:.45;}
  .day-sep{width:100%; height:1px; background:rgba(var(--shadow-rgb),.15); margin:4px 0;}

  /* level map + reward badges (v3: levels instead of days) */
  .level-map{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
  .level-card{border:none; border-radius:18px; padding:10px 8px; background:var(--card); box-shadow:0 10px 20px -14px rgba(var(--shadow-rgb),.25); display:flex; flex-direction:column; align-items:center; gap:4px; transition:transform .15s;}
  .level-card:active{transform:scale(.96);}
  .level-card .level-badge{font-size:1.4rem;}
  .level-card .level-name{font-family:'Baloo 2'; font-weight:700; font-size:.72rem; line-height:1.15; color:var(--ink-soft); text-align:center;}
  .level-card.level-current{background:linear-gradient(155deg,var(--coral),var(--coral-deep)); box-shadow:0 0 0 3px var(--sun), 0 14px 26px -14px rgba(0,0,0,.35);}
  .level-card.level-current .level-name{color:#fff;}
  .level-card.level-done{background:linear-gradient(155deg,var(--leaf),var(--leaf-deep));}
  .level-card.level-done .level-name{color:#fff;}
  .level-card.level-locked{opacity:.5;}
  .badge-shelf{margin-top:18px; text-align:center;}
  .badge-shelf-title{font-family:'Baloo 2'; font-weight:700; font-size:.85rem; color:var(--ink-soft); margin:0 0 8px;}
  .badge-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap;}
  .badge-chip{width:42px; height:42px; border-radius:50%; background:rgba(var(--shadow-rgb),.08); display:flex; align-items:center; justify-content:center; font-size:1.3rem; opacity:.6; filter:grayscale(.75); border:none; padding:0;}
  .badge-chip.unlocked{opacity:1; filter:none; background:var(--card); box-shadow:0 8px 16px -10px rgba(var(--shadow-rgb),.3);}
  .badge-chip:not(.unlocked){cursor:default;}
  .dash-card{background:var(--card); border-radius:20px; padding:16px; margin-bottom:12px; box-shadow:0 10px 22px -16px rgba(var(--shadow-rgb),.3);}
  .dash-card-title{font-size:.78rem; color:var(--ink-soft); font-weight:800; margin:0 0 10px; display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:.03em;}
  .dash-level-track{background:rgba(var(--shadow-rgb),.1); border-radius:999px; height:16px; overflow:hidden; margin-top:6px;}
  .dash-level-fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--sky),var(--leaf)); transition:width .3s;}
  .reward-toast{position:fixed; top:-80px; left:50%; transform:translateX(-50%); background:linear-gradient(155deg,var(--sun),var(--sun-deep)); color:#fff; font-family:'Baloo 2'; font-weight:700; font-size:1.02rem; padding:13px 24px; border-radius:999px; box-shadow:0 14px 30px -14px rgba(0,0,0,.4); z-index:200; transition:top .4s cubic-bezier(.34,1.56,.64,1); text-align:center; max-width:88vw;}
  .reward-toast.show{top:18px;}

  /* ---------- Game stage ---------- */
  .stage{flex:1; display:flex; flex-direction:column;}
  .progress-row{display:flex; gap:7px; justify-content:center; margin-bottom:14px;}
  .pdot{width:13px; height:13px; border-radius:50%; background:rgba(var(--shadow-rgb),.14);}
  .pdot.done{background:var(--berry);}
  .pdot.now{background:var(--ink); transform:scale(1.3);}
  .progress-count{text-align:center; font-weight:700; color:var(--ink-soft); font-size:.8rem; margin:-6px 0 12px;}
  /* level-complete award ceremony */
  .award-badge{width:130px; height:130px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:3.6rem; margin:4px auto 0; box-shadow:0 20px 40px -18px rgba(0,0,0,.35), 0 0 0 6px rgba(255,255,255,.55) inset; animation:badgePop .7s cubic-bezier(.34,1.56,.64,1);}
  .award-rank-label{font-weight:700; color:var(--ink-soft); font-size:.92rem; margin:10px 0 0; animation:rankIn .5s ease .3s both;}
  .award-rank{font-family:'Baloo 2'; font-weight:800; font-size:1.5rem; margin:2px 0 0; animation:rankIn .55s ease .4s both;}
  @keyframes badgePop{0%{transform:scale(0) rotate(-25deg); opacity:0;} 60%{transform:scale(1.15) rotate(8deg); opacity:1;} 100%{transform:scale(1) rotate(0);}}
  @keyframes rankIn{0%{transform:translateY(14px); opacity:0;} 100%{transform:translateY(0); opacity:1;}}
  .stage-card{background:var(--card); border-radius:30px; padding:28px 20px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; box-shadow:0 20px 40px -22px rgba(var(--shadow-rgb),.35), 0 2px 8px rgba(var(--shadow-rgb),.06); min-height:320px;}
  .domain-tag{font-family:'Baloo 2'; font-weight:700; font-size:.82rem; letter-spacing:.05em; text-transform:uppercase; padding:6px 16px; border-radius:999px; color:#fff;}
  .tag-read{background:var(--coral);} .tag-math{background:var(--sun-deep);} .tag-write{background:var(--leaf);}

  /* letter/syllable tiles */
  .tiles-row{display:flex; align-items:center; justify-content:center; gap:10px; min-height:110px; flex-wrap:wrap; max-width:100%;}
  .tile{font-family:'Baloo 2'; font-weight:800; font-size:clamp(2.2rem,10vw,3.6rem); background:linear-gradient(160deg,#fff,#F7F4FF); border-radius:20px; width:clamp(72px,20vw,110px); height:clamp(72px,20vw,110px); display:flex; align-items:center; justify-content:center; color:var(--ink); box-shadow:0 12px 24px -14px rgba(var(--shadow-rgb),.3); transition:transform .5s cubic-bezier(.34,1.56,.64,1);}
  /* v29: по прямой просьбе пользователя — было 30px сдвига при зазоре
     .tiles-row всего 14px, буквы наезжали на кнопку/картинку между ними
     уже в состоянии покоя. 10px < 14px зазора — буквы по-прежнему
     заметно «тянутся» друг к другу, но больше не перекрывают картинку. */
  .tile.merge-a{transform:translateX(10px);}
  .tile.merge-b{transform:translateX(-10px);}
  .tile.wide{width:auto; min-width:60px; max-width:88vw; padding:0 10px; font-size:clamp(1rem,6vw,3.6rem); word-break:break-word;}
  .tile.joined{transform:translateX(0) !important;}
  .word-emoji{width:clamp(120px,32vw,168px); height:clamp(120px,32vw,168px); object-fit:contain; animation:pop .5s ease;}
  .emoji-media{display:flex; align-items:center; justify-content:center; line-height:1;}
  .btn-icon-img{width:55%; height:55%; object-fit:contain; display:block; pointer-events:none;}
  .badge-icon-img{width:100%; height:100%; object-fit:contain; display:block; pointer-events:none;}
  .level-badge-img{width:40px; height:40px; object-fit:contain; display:block; margin:0 auto;}
  .level-hub-icon{width:84px; height:84px; object-fit:contain; display:block; margin:4px auto; filter:drop-shadow(0 6px 12px rgba(var(--shadow-rgb),.25));}
  .level-hub-icon.emoji-media{font-size:3.2rem;}
  .award-badge-img{width:65%; height:65%; object-fit:contain; display:block;}
  .word-emoji.emoji-media{font-size:clamp(70px,26vw,130px);}
  .choice-pic.emoji-media{font-size:2.3rem;}
  /* v39: реальные картинки в «Раздели поровну» вместо emoji (яблоко уже
     есть в ICONS, друзья ждут промт — до тех пор честный emoji-фолбэк). */
  .shareequal-apple{width:22px; height:22px; object-fit:contain; display:inline-block;}
  .shareequal-apple.emoji-media{font-size:1.5rem; width:auto; height:auto;}
  .shareequal-friend{width:52px; height:52px; object-fit:contain; display:inline-block;}
  .shareequal-friend.emoji-media{font-size:1.4rem; width:auto; height:auto;}
  .word-caption{font-family:'Baloo 2'; font-weight:700; font-size:clamp(1rem,5.5vw,1.6rem); letter-spacing:.02em; max-width:92vw; word-break:break-word; text-align:center;}
  .wb-slots{display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin:4px 0;}
  .wb-slot{width:42px; height:52px; border-radius:10px; border:3px dashed rgba(var(--shadow-rgb),.25); background:var(--card); display:inline-flex; align-items:center; justify-content:center; font-family:'Baloo 2'; font-weight:800; font-size:1.5rem; color:var(--ink);}
  .wb-slot.filled{background:linear-gradient(155deg,var(--sun),var(--sun-deep)); border:none; color:#fff; animation:pop .3s ease;}
  /* v12: по просьбе пользователя уже использованная буква в «Собери
     слово» становится красной — свободные буквы визуально отличаются от
     занятых с первого взгляда. */
  .tile.is-correct{background:linear-gradient(160deg,#FF8F7E,var(--coral-deep)); color:#fff; box-shadow:0 8px 16px -12px rgba(232,91,71,.5);}
  /* v29: по прямой просьбе пользователя — в задании «Правильная буква»
     верный ответ должен подсвечиваться ЗЕЛЁНЫМ, как во всех остальных
     заданиях (.choice-btn.is-correct), а не унаследованным от .tile
     коралловым цветом «занятой буквы» из «Собери слово». Модификатор
     letter-answer-tile нужен именно здесь, чтобы не задеть «Собери
     слово» — у него своя, намеренно красная, семантика. */
  .tile.letter-answer-tile.is-correct{background:linear-gradient(160deg,#ECFBF6,#DEF7EF); color:var(--ink); box-shadow:0 0 0 4px var(--leaf), 0 12px 22px -14px rgba(34,163,135,.4);}
  .tile.letter-answer-tile.is-wrong{background:#FFF0EE; box-shadow:0 0 0 4px var(--coral); opacity:.5;}
  .session-min-btn{font-family:'Baloo 2'; font-weight:700; font-size:.85rem; color:var(--ink); background:linear-gradient(160deg,#fff,#F7F4FF); border:2px solid rgba(var(--shadow-rgb),.15); border-radius:999px; padding:8px 16px; transition:transform .15s;}
  .session-min-btn.active{background:linear-gradient(155deg,var(--sky),var(--sky-deep)); color:#fff; border-color:transparent; box-shadow:0 8px 16px -10px rgba(61,138,209,.5);}

  /* big icon-first "do this" button — no reading required */
  .fab{border:none; border-radius:50%; width:88px; height:88px; font-size:2.4rem; display:flex; align-items:center; justify-content:center; color:#fff; background:linear-gradient(155deg,var(--sky),var(--sky-deep)); box-shadow:0 16px 30px -14px rgba(61,138,209,.65); transition:transform .15s;}
  .fab:active{transform:scale(.92);}

  .big-btn{font-family:'Baloo 2'; font-weight:700; font-size:1.1rem; color:#fff; background:var(--sky); border:none; border-radius:999px; padding:15px 32px; box-shadow:0 14px 26px -14px rgba(61,138,209,.6); transition:transform .15s;}
  .alphabet-btn-icon{width:24px; height:24px; object-fit:contain; flex:none;}
  .alphabet-btn-icon.emoji-media{font-size:1.3rem; width:auto; height:auto;}
  .big-btn:active{transform:scale(.95);}
  .big-btn.solid-berry{background:linear-gradient(155deg,var(--berry),var(--berry-deep)); box-shadow:0 14px 26px -14px rgba(198,63,128,.6);}
  .big-btn.solid-leaf{background:linear-gradient(155deg,var(--leaf),var(--leaf-deep)); box-shadow:0 14px 26px -14px rgba(34,163,135,.6);}
  .big-btn.ghost{background:var(--card); color:var(--ink); box-shadow:0 10px 22px -14px rgba(var(--shadow-rgb),.3);}

  .icon-choice-col{display:flex; flex-direction:column; align-items:center; gap:8px;}
  .icon-choice-col .cap{font-size:.8rem; font-weight:700; color:var(--ink-soft);}

  .choice-grid{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .choice-btn{background:linear-gradient(160deg,#fff,#F7F4FF); border:none; border-radius:24px; width:96px; height:96px; display:flex; align-items:center; justify-content:center; box-shadow:0 12px 22px -14px rgba(var(--shadow-rgb),.28); transition:transform .15s, box-shadow .15s;}
  .choice-btn:active{transform:scale(.92);}
  .choice-btn.is-correct{background:linear-gradient(160deg,#ECFBF6,#DEF7EF); box-shadow:0 0 0 4px var(--leaf), 0 12px 22px -14px rgba(34,163,135,.4);}
  .choice-btn.is-wrong{background:#FFF0EE; box-shadow:0 0 0 4px var(--coral); opacity:.5;}
  /* v27: по прямой просьбе пользователя — загорающийся и исчезающий
     красный крест поверх ЛЮБОГО элемента с классом is-wrong (его уже
     проставляют все обработчики неверных ответов по всему приложению —
     эффект появляется сразу везде, без правки каждого обработчика). */
  .is-wrong{position:relative;}
  .is-wrong::before, .is-wrong::after{content:''; position:absolute; top:50%; left:50%; width:78%; height:9px; background:linear-gradient(90deg,#D9261A,#FF5142); border-radius:5px; box-shadow:0 0 4px 2px #fff, 0 0 22px 7px rgba(232,53,42,.95); pointer-events:none; z-index:5;}
  .is-wrong::before{animation:wrongXBefore .7s ease-out forwards;}
  .is-wrong::after{animation:wrongXAfter .7s ease-out forwards;}
  @keyframes wrongXBefore{0%{opacity:0; transform:translate(-50%,-50%) rotate(45deg) scale(.2);} 22%{opacity:1; transform:translate(-50%,-50%) rotate(45deg) scale(1.35);} 45%{opacity:1; transform:translate(-50%,-50%) rotate(45deg) scale(1);} 80%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) rotate(45deg) scale(1);}}
  @keyframes wrongXAfter{0%{opacity:0; transform:translate(-50%,-50%) rotate(-45deg) scale(.2);} 22%{opacity:1; transform:translate(-50%,-50%) rotate(-45deg) scale(1.35);} 45%{opacity:1; transform:translate(-50%,-50%) rotate(-45deg) scale(1);} 80%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) rotate(-45deg) scale(1);}}
  .choice-pic{width:74%; height:74%; object-fit:contain;}

  /* sound analysis (Elkonin-style word scheme) */
  .sound-slot{width:60px; height:60px; border-radius:50%; border:3px dashed rgba(var(--shadow-rgb),.25); background:var(--card); font-family:'Baloo 2'; font-weight:800; font-size:1.5rem; color:var(--ink-soft); transition:transform .15s, opacity .15s;}
  .sound-slot:disabled{opacity:.5;}
  .sound-slot.slot-vowel{background:linear-gradient(155deg,#FF8F7E,var(--coral-deep)); color:#fff; border:none; opacity:1; animation:pop .4s ease;}
  .sound-slot.slot-consonant{background:linear-gradient(155deg,#6FB6F2,var(--sky-deep)); color:#fff; border:none; opacity:1; animation:pop .4s ease;}

  /* seriation (order by size) */
  .seriate-row{display:flex; align-items:flex-end; gap:22px; justify-content:center; min-height:130px;}
  .seriate-item{background:none; border:none; transition:transform .15s, filter .15s; line-height:1;}
  .seriate-item.is-correct{filter:drop-shadow(0 8px 14px rgba(34,163,135,.45)); transform:translateY(-4px);}
  .seriate-item.is-wrong{animation:shake .35s ease;}

  /* math visuals */
  .obj-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:340px;}
  .obj-icon{width:42px; height:42px; object-fit:contain;}
  .obj-icon-sm{width:26px; height:26px; object-fit:contain; margin:2px;}
  .compare-wrap{display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap;}
  .compare-group{background:linear-gradient(160deg,#fff,#F7F4FF); border-radius:22px; padding:14px; width:126px; max-width:38vw; text-align:center; border:none; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; box-shadow:0 12px 24px -14px rgba(var(--shadow-rgb),.28); transition:transform .15s;}
  .compare-group:active{transform:scale(.95);}
  .eq-btn{width:52px; height:52px; border-radius:50%; border:none; background:var(--card); color:var(--ink); font-family:'Baloo 2'; font-weight:800; font-size:1.4rem; box-shadow:0 10px 20px -12px rgba(var(--shadow-rgb),.3); flex:none; transition:transform .15s; display:flex; align-items:center; justify-content:center; line-height:1; padding:0;}
  .obj-removed{opacity:.28; filter:grayscale(1); position:relative;}
  .obj-removed::after{content:'✕'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--coral-deep); font-weight:900; font-size:1.1em; opacity:.8;}
  .eq-btn:active{transform:scale(.9);}
  .num-btn{font-family:'Baloo 2'; font-weight:800; font-size:1.8rem; width:76px; height:76px; border-radius:50%; background:linear-gradient(160deg,#fff,#F7F4FF); border:none; color:var(--ink); box-shadow:0 12px 22px -14px rgba(var(--shadow-rgb),.28); transition:transform .15s;}
  .num-btn:active{transform:scale(.9);}
  /* v50: по прямой просьбе пользователя - .num-btn не наследует от .tile
     и своего .is-correct/.is-wrong стиля не имело, поэтому верный ответ
     в числовых заданиях визуально не отличался (крестик на неверном уже
     работал - он общий для любого .is-wrong). Тот же зелёный, что у
     .choice-btn.is-correct. */
  .num-btn.is-correct{background:linear-gradient(160deg,#ECFBF6,#DEF7EF); box-shadow:0 0 0 4px var(--leaf), 0 12px 22px -14px rgba(34,163,135,.4);}
  .num-btn.is-wrong{background:#FFF0EE; box-shadow:0 0 0 4px var(--coral); opacity:.5;}
  /* v59: .compare-group/.eq-btn (задание "больше/меньше") - та же беда,
     что была у .num-btn в v50 - свой стиль карточки, но не своя
     is-correct/is-wrong подсветка, поэтому верный ответ никогда не
     загорался зелёным. */
  .compare-group.is-correct{background:linear-gradient(160deg,#ECFBF6,#DEF7EF); box-shadow:0 0 0 4px var(--leaf), 0 12px 22px -14px rgba(34,163,135,.4);}
  .compare-group.is-wrong{background:#FFF0EE; box-shadow:0 0 0 4px var(--coral); opacity:.5;}
  .eq-btn.is-correct{background:linear-gradient(160deg,#ECFBF6,#DEF7EF); box-shadow:0 0 0 4px var(--leaf);}
  .eq-btn.is-wrong{background:#FFF0EE; box-shadow:0 0 0 4px var(--coral); opacity:.5;}
  .dot-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; max-width:280px;}
  .dot{width:22px; height:22px; border-radius:50%; background:var(--sun-deep);}
  .cover{position:relative; display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; background:var(--ink); border-radius:16px; font-size:1.6rem;}
  .alpha-section-title{font-family:'Baloo 2'; font-weight:800; font-size:1.15rem; text-align:center; margin:18px 0 10px; color:var(--ink);}
  .alpha-section-vowels{color:var(--coral-deep);}
  .alpha-section-consonants{color:var(--sky-deep);}
  .alpha-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:10px; margin-bottom:8px;}
  .alpha-cell{background:var(--card); border:none; width:100%; cursor:pointer; border-radius:16px; padding:10px 6px 8px; display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:0 8px 16px -12px rgba(var(--shadow-rgb),.3); transition:transform .15s;}
  .alpha-cell:active{transform:scale(.93);}
  /* v59: компактная плитка для "Числа 11-100 -> Остальные числа" - только
     цифра, без картинки (по прямой просьбе пользователя), чтобы 72 числа
     поместились без гигантской простыни. */
  .num-plain-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(52px,1fr)); gap:8px; margin-bottom:8px;}
  .num-plain-cell{background:var(--card); border:none; cursor:pointer; border-radius:12px; padding:10px 4px; font-family:'Baloo 2'; font-weight:800; font-size:1.05rem; color:var(--ink); box-shadow:0 6px 14px -10px rgba(var(--shadow-rgb),.3); transition:transform .15s;}
  .num-plain-cell:active{transform:scale(.9);}
  .alpha-modal-pic{width:100%; height:100%; object-fit:contain; display:block;}
  .alpha-letter{font-family:'Baloo 2'; font-weight:800; font-size:1.6rem; color:var(--ink);}
  .alpha-pic{width:42px; height:42px; object-fit:contain;}
  .alpha-word{font-family:'Baloo 2'; font-weight:700; font-size:.65rem; text-align:center; color:var(--ink-soft); letter-spacing:.02em; max-width:100%; overflow-wrap:break-word; word-break:break-word; padding:0 2px; box-sizing:border-box;}
  .alpha-word-empty{opacity:.4;}
  .cloud-cover{display:inline-flex; align-items:center; justify-content:center; width:78px; height:78px;}
  .cloud-cover-img{width:100%; height:100%; object-fit:contain;}
  .sun-dot-img{width:24px; height:24px; object-fit:contain;}
  /* v49: раздел «Числа» - мини-ряд предметов в ячейке сетки (символичное
     количество для цифры), крупный ряд - в модалке при увеличении. */
  .num-dot-row{display:flex; flex-wrap:wrap; gap:1px; justify-content:center; max-width:74px; min-height:12px;}
  .num-dot-mini{width:7px; height:7px; object-fit:contain;}
  /* v51: символичная картинка цифры (бублик/луна/ноги/...) - НАД рядом
     солнышек, не вместо него (по прямой просьбе пользователя). */
  .num-pic-mini{width:34px; height:34px; object-fit:contain; display:block; margin:2px auto;}
  .num-pic-mini.emoji-media{font-size:1.7rem;}
  .num-pic-modal{width:96px; height:96px; object-fit:contain; display:block; margin:0 auto;}
  .alarm-clock-img{width:100%; height:100%; object-fit:contain; display:block;}
  .alarm-clock-img.emoji-media{font-size:5.5rem; display:flex; align-items:center; justify-content:center;}
  .num-pic-modal.emoji-media{font-size:3.4rem;}
  /* v53: «Числа 11-100» - связка из десяти (десятки) рядом с отдельными
     солнышками (единицы), тот же масштаб, что и num-dot-mini. */
  .ten-bundle-mini{width:14px; height:14px; object-fit:contain;}
  .ten-bundle-mini.emoji-media{font-size:.85rem;}
  /* v54: буква/цифра в тексте задания обводки - кликабельна (услышать
     звук), лёгкое визуальное приглашение нажать. */
  .letter-inline-btn{background:none; border:none; padding:0; font:inherit; font-weight:800; color:var(--coral-deep); text-decoration:underline dotted; text-decoration-thickness:2px; cursor:pointer;}
  .letter-inline-btn:active{transform:scale(.94);}
  /* v54: значок на кнопке «Поехали!» на переменке - замена эмодзи-ракеты. */
  .break-start-icon{width:26px; height:26px; object-fit:contain;}
  .break-start-icon.emoji-media{font-size:1.3rem;}

  /* writing/tracing */
  .canvas-wrap{border-radius:26px; padding:10px; background:linear-gradient(160deg,#fff,#F4F0FF); box-shadow:0 16px 30px -18px rgba(var(--shadow-rgb),.3); touch-action:none;}
  canvas{display:block; border-radius:16px; background:#fff; touch-action:none;}
  .trace-foot{display:flex; align-items:center; justify-content:center; gap:14px; min-height:60px;}
  /* v93: по прямой просьбе пользователя - значок-картинка (btnIcon(), см.
     кнопку-подсказку "?") внутри этой кнопки был display:block без
     центрирования - text-align:center кнопки центрирует только текст/
     эмодзи (✅/⏭ и так были в порядке), но не блочную картинку. */
  .skip-fab{width:40px; height:40px; border-radius:50%; border:none; background:var(--card); color:var(--ink-soft); font-size:1rem; box-shadow:0 8px 16px -10px rgba(var(--shadow-rgb),.25); display:flex; align-items:center; justify-content:center;}
  .next-row{display:flex; justify-content:center; margin:14px 0 0;}

  /* break overlay */
  .break-screen{position:fixed; inset:0; background:linear-gradient(160deg,var(--sky),var(--sky-deep)); z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:20px; color:#fff; padding-top:max(36px, 8vh); overflow-y:auto; padding:20px; text-align:center;}
  .break-icon{width:150px; height:150px; object-fit:contain; animation:wiggle 1.4s ease-in-out infinite;}
  .break-icon.emoji-media{font-size:4.5rem;}
  .timer-wrap{position:relative; width:150px; height:150px;}
  .timer-num{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Baloo 2'; font-size:2.6rem; font-weight:800;}

  /* voice settings */
  .voice-list{display:flex; flex-direction:column; gap:10px; width:100%; max-width:420px; margin:0 auto;}
  .voice-row{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:18px; padding:6px 6px 6px 18px; box-shadow:0 10px 20px -14px rgba(var(--shadow-rgb),.3);}
  .voice-row.active{box-shadow:0 0 0 3px var(--sky), 0 10px 20px -14px rgba(var(--shadow-rgb),.3);}
  .voice-pick{flex:1; text-align:left; background:none; border:none; font-weight:700; color:var(--ink); padding:10px 0; font-size:.98rem;}
  .voice-play{width:42px; height:42px; border-radius:50%; border:none; background:var(--sky); color:#fff; font-size:1rem; flex:none;}
  .parent-zone{margin-top:24px; padding-top:16px; border-top:1px dashed rgba(var(--shadow-rgb),.2); text-align:center;}
  .link-quiet{background:none; border:none; color:var(--ink-soft); font-size:.82rem; text-decoration:underline; font-weight:700;}

  /* star burst */
  .star-fly{position:fixed; z-index:99; font-size:1.8rem; pointer-events:none; animation:floatUp 1s ease-out forwards;}
  /* v27: по прямой просьбе пользователя — «загорающийся фейерверк» (яркая
     радиальная вспышка в точке верного ответа) + цветное конфетти,
     разлетающееся во все стороны (а не только вверх, как раньше). */
  .firework-flash{position:fixed; left:0; top:0; width:14px; height:14px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,214,84,.85) 30%, rgba(255,107,107,.5) 55%, rgba(255,107,107,0) 72%); transform:translate(-50%,-50%) scale(.3); z-index:150; pointer-events:none; animation:fireworkFlash .55s ease-out forwards;}
  @keyframes fireworkFlash{0%{transform:translate(-50%,-50%) scale(.2); opacity:1;} 55%{opacity:.9;} 100%{transform:translate(-50%,-50%) scale(7); opacity:0;}}
  .confetti-piece{position:fixed; left:0; top:0; width:8px; height:8px; border-radius:2px; z-index:149; pointer-events:none; animation:confettiFly .95s cubic-bezier(.25,.7,.4,1) forwards;}
  @keyframes confettiFly{0%{transform:translate(-50%,-50%) scale(.5) rotate(0deg); opacity:1;} 65%{opacity:1;} 100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 70px)) scale(1) rotate(var(--rot)); opacity:0;}}

  @keyframes pop{0%{transform:scale(.55); opacity:0;} 65%{transform:scale(1.1); opacity:1;} 100%{transform:scale(1);}}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg);} 50%{transform:rotate(6deg);}}
  @keyframes floatUp{0%{transform:translate(0,0) rotate(0) scale(1); opacity:1;} 100%{transform:translate(var(--dx,0px),-150px) rotate(var(--rot,0deg)) scale(1.5); opacity:0;}}
  @keyframes float{0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);}}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}

  @media (max-width:420px){
    .choice-btn{width:80px; height:80px; font-size:2.1rem;}
    .tile{font-size:clamp(1.8rem,12vw,2.6rem);}
  }

  /* v79: именной сертификат об окончании всей Академии */
  .cert-screen{position:fixed; inset:0; z-index:80; background:linear-gradient(160deg,#2E2A4A,#4A3F7A 55%,#6B4A9E); display:flex; flex-direction:column; align-items:center; justify-content:flex-start; overflow-y:auto; padding:20px 16px 40px;}
  .cert-card{background:linear-gradient(170deg,#FFFDF6,#FFF6E0); border-radius:26px; padding:32px 26px; max-width:480px; width:100%; text-align:center; box-shadow:0 30px 70px -20px rgba(0,0,0,.55); border:6px solid var(--sun); margin-top:14px; position:relative;}
  .cert-card::before{content:""; position:absolute; inset:10px; border:2px dashed var(--sun-deep); border-radius:16px; pointer-events:none; opacity:.55;}
  /* v81: 5 фоновых тем сертификата (случайно, без повтора, пока не увидены все 5) - фото уже несёт свою декоративную рамку, поэтому обычная кремовая заливка+пунктир отключаются. */
  .cert-card.has-bg-photo{border:none; background-color:transparent; background-size:cover; background-position:center;}
  .cert-card.has-bg-photo::before{content:none;}
  /* v93: по прямой просьбе пользователя - v91 сделал шрифт слишком
     мелким/тусклым ради "влезет ли текст" - вернули формат/размер карточки
     к исходному (padding, кубок) и сделали сам ТЕКСТ короче (см.
     certMainLine/certAwardsList/certExtrasNote), а не жертвовали
     читаемостью. Шрифт ярче (var(--ink), не блёклый --ink-soft) и
     плотнее (line-height 1.3, а не 1.5) - меньше "растянутых" строк. */
  .cert-trophy{width:128px; height:128px; object-fit:contain; margin:4px auto 6px; filter:drop-shadow(0 10px 18px rgba(0,0,0,.25));}
  .cert-trophy.emoji-media{font-size:5rem;}
  .cert-title{font-family:'Baloo 2'; font-weight:800; font-size:1.45rem; color:var(--berry-deep); margin:4px 0 2px;}

<script>
(function(){
  "use strict";

  /* =================== ACCESS (демо-доступ / оплата) ===================
   * Игра лежит на публичном хостинге, поэтому «доступ» нельзя передавать
   * голым параметром (?access=full — его мог бы подставить кто угодно).
   * Бот открывает игру ссылкой ?t=<токен>: токен подписан закрытым ключом
   * бота (ECDSA P-256, ключ только на сервере бота), здесь он проверяется
   * открытым ключом ACCESS_PUBLIC_JWK. В токене — Telegram ID владельца
   * доступа и режим: «full» (оплачено) или «demo» + момент старта демо.
   * Принимается только токен с верной подписью И с ID, совпадающим с тем,
   * кто реально открыл игру в Telegram — подделанную или чужую ссылку игра
   * не примет. Демо — бесплатный уровень 1 «Первые шаги» без ограничения по
   * времени, плюс «Алфавит» и «Числа 0–10» на 24 часа от "s" — момента, когда
   * бот впервые выдал демо (storage.demo_started_at).
   * Без токена (страница открыта напрямую) доступа нет — его выдаёт только бот.
   * Проверка подписи асинхронная, поэтому первый экран рисуется после
   * accessReady (см. конец скрипта). Меняете ключ — обновите JWK и
   * задеплойте игру заново, иначе все выданные ссылки перестанут работать. */
  var ACCESS_LS_KEY = 'ryzhik_access_v2';
  var DEMO_SECTIONS_HOURS = 24;   // столько в демо открыты «Алфавит» и «Числа»
  var ACCESS_PUBLIC_JWK = {kty:'EC', crv:'P-256',
    x:'152r6jHQ2vT65CDSBYByLoOPrYgyY95MKOWtHGKc-iY',
    y:'OvX1_3Gt12VosX0wTeUdduia0UMw9CFtDc_WL7Gfklc'};
  var ACCESS = {mode:'none', startedAt:0};   // итог проверки; задаётся в accessReady

  function b64urlToBytes(s){
    s = s.replace(/-/g,'+').replace(/_/g,'/');
    while(s.length % 4) s += '=';
    var bin = atob(s), out = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function telegramUserId(){
    try{
      var u = window.Telegram.WebApp.initDataUnsafe.user;
      return u && u.id ? Number(u.id) : null;
    }catch(e){ return null; }
  }
  // Promise<полезная нагрузка | null>: null — подпись неверна или токен испорчен.
  function verifyAccessToken(token){
    return new Promise(function(resolve){
      try{
        if(!token || typeof token !== 'string' || !window.crypto || !crypto.subtle) return resolve(null);
        var parts = token.split('.');
        if(parts.length !== 2) return resolve(null);
        crypto.subtle.importKey('jwk', ACCESS_PUBLIC_JWK, {name:'ECDSA', namedCurve:'P-256'}, false, ['verify'])
          .then(function(key){
            return crypto.subtle.verify({name:'ECDSA', hash:'SHA-256'}, key,
              b64urlToBytes(parts[1]), new TextEncoder().encode(parts[0]));
          })
          .then(function(ok){
            if(!ok) return resolve(null);
            resolve(JSON.parse(new TextDecoder().decode(b64urlToBytes(parts[0]))));
          })
          .catch(function(){ resolve(null); });
      }catch(e){ resolve(null); }
    });
  }
  var accessReady = (function(){
    var urlToken = null, stored = null;
    try{ urlToken = new URLSearchParams(location.search).get('t'); }catch(e){}
    try{ stored = localStorage.getItem(ACCESS_LS_KEY); localStorage.removeItem('ryzhik_access_v1'); }catch(e){}
    var candidates = [];
    if(urlToken) candidates.push(urlToken);
    if(stored && stored !== urlToken) candidates.push(stored);
    return Promise.all(candidates.map(function(t){
      return verifyAccessToken(t).then(function(p){ return {t:t, p:p}; });
    })).then(function(results){
      var uid = telegramUserId();
      var valid = results.filter(function(r){
        return r.p && uid !== null && Number(r.p.u) === uid &&

      var best = valid.filter(function(r){ return r.p.a === 'full'; })[0] || valid[0];

        ACCESS = best.p.a === 'full' ? {mode:'full', startedAt:0} : {mode:'demo', startedAt:Number(best.p.s)};
        try{ localStorage.setItem(ACCESS_LS_KEY, best.t); }catch(e){}

        try{ if(stored) localStorage.removeItem(ACCESS_LS_KEY); }catch(e){}
      }

      try{

  function hasAnyAccess(){ return ACCESS.mode === 'full' || ACCESS.mode === 'demo'; }
  // «Алфавит» и «Числа 0–10» в демо открыты первые 24 часа.
  function demoSectionsActive(){

      (Date.now() - ACCESS.startedAt) < DEMO_SECTIONS_HOURS * 3600 * 1000;

  function canAccessLevel(lv){
    if(hasFullAccess()) return true;
    return lv === 1 && hasAnyAccess();

  // v64: делит остаток слова после первых 2 букв ("b" в READING_ITEMS_BY_LEVEL)
  // на слоговые фрагменты для задания "слепи слог". Правило (упрощённое,
  // но линейно точное - результат всегда точно восстанавливает исходную
  // строку): у каждой гласной - ровно один непосредственно предшествующий
  // согласный как "начало" слога; всё, что перед ним сверху (лишние
  // согласные подряд) - отдельный фрагмент-хвостик предыдущего слога
  // (напр. "льмени" -> "ль"+"ме"+"ни", как настоящее "пель-ме-ни").
  // Если гласных 0 или после отделения хвостика остался только 1 кусок -
  // делить нет смысла, возвращаем исходную строку целиком.
  var RU_VOWELS = 'АЕЁИОУЫЭЮЯ';
  function splitIntoSyllableFragments(word){
    word = word.toUpperCase();
    var vIdx = [];
    for(var i=0;i<word.length;i++){ if(RU_VOWELS.indexOf(word[i]) !== -1) vIdx.push(i); }
    if(vIdx.length === 0) return [word];
    var onsetStart = [];
    for(var k=0;k<vIdx.length;k++){
      var v = vIdx[k];
      var prevBoundary = (k === 0) ? -1 : vIdx[k-1];
      onsetStart.push((v - 1 > prevBoundary) ? v - 1 : v);
    }
    var fragments = [];
    var leadExtra = word.slice(0, onsetStart[0]);
    if(leadExtra) fragments.push(leadExtra);
    for(var k2=0;k2<vIdx.length;k2++){
      var start = onsetStart[k2];
      var end = (k2 + 1 < vIdx.length) ? onsetStart[k2+1] : word.length;
      fragments.push(word.slice(start, end));
    }
    return fragments.length > 1 ? fragments : [word];
  }

  // v6: у каждой награды теперь есть описание (за что и что даёт) — по

  // v15: достижения за поведение, а не за общее число звёзд — по прямой

  // фантазию, за любознательность, за успехи в математике»). Иконки пока

  // память проекта про пересчёт STAR_BADGES/ACHIEVEMENTS.
  var ACHIEVEMENTS = [

    {key:'speedster', name:'Быстрая молния', icon:ICONS.ach_speedster, desc:'Ответь правильно 30 раз подряд без единой ошибки — уверенно и быстро!'},
    {key:'curious', name:'Почемучка', icon:ICONS.ach_curious, desc:'Нажми кнопку «Прослушать» 40 раз — тебе интересно услышать буквы ещё раз!'},
    {key:'creative', name:'Выдумщик', icon:ICONS.ach_creative, desc:'Собери слово из букв в задании «Собери слово» 40 раз!'},
    {key:'math_star', name:'Математический гений', icon:ICONS.ach_math, desc:'Реши 200 заданий с цифрами правильно!'},
    {key:'reading_star', name:'Книголюб', icon:ICONS.ach_reading, desc:'Реши 200 заданий с буквами правильно!'}

  function achievementProgressValue(key){
    if(key === 'no_mistakes') return state.achievementsUnlocked.indexOf('no_mistakes')!==-1 ? 1 : 0;
    if(key === 'speedster') return Math.min(state.streak, 30);
    if(key === 'curious') return Math.min(state.achProgress.listen, 40);
    if(key === 'creative') return Math.min(state.achProgress.wordbuild, 40);
    if(key === 'math_star') return Math.min(state.achProgress.mathCorrect, 200);
    if(key === 'reading_star') return Math.min(state.achProgress.letterCorrect, 200);
    return 0;
  }
  function achievementTarget(key){
    if(key === 'no_mistakes') return 1;
    if(key === 'math_star' || key === 'reading_star') return 200;
    if(key === 'speedster') return 30;
    return 40;
  }
  // Единая точка разблокировки: не повторяет toast, если уже получено.
  function unlockAchievement(key){
    if(state.achievementsUnlocked.indexOf(key) !== -1) return;
    state.achievementsUnlocked.push(key);

    var a = ACHIEVEMENTS.filter(function(x){ return x.key === key; })[0];

  // v79: по прямой просьбе пользователя - именной сертификат-грамота,

  function isFullyComplete(){

  // v81: по прямой просьбе пользователя - 5 фоновых тем сертификата

  // v91: по прямой просьбе пользователя - обращение по полу вместо
  // безликих слэшей "прошёл(-ла)". Угадываем по имени: короткий список
  // мужских имён-исключений на -а/-я (иначе выглядели бы как женские по
  // общему правилу), иначе последняя буква а/я = женское, всё остальное
  // мужское. Это эвристика, не идеальная (не знает всех имён), но лучше
  // безликой формы для конкретного ребёнка с известным именем.
  // v91: короткие/детские формы имён - в русском языке огромный класс

  // женское" ошибочно перепутало бы пол в половине мальчишеских имён,

  // частых русских имён/уменьшительных, не исчерпывающее.
  var MALE_NAMES_ENDING_VOWEL = [
    'никита','илья','кузьма','фома','лука','савва','гаврила','данила',
    'дима','митя','стёпа','степа','слава','рома','гриша','серёжа','сережа',
    'тёма','тема','юра','лёша','леша','алёша','алеша','миша','саша','паша',

  // значков (certAwardsList), а не текстом, так что честность никуда не

  function certMainLine(){

  function certAwardsList(){

      .concat(achs.map(function(a){ return '<img src="'+(a.icon||'')+'" alt="'+a.name+'" title="'+a.name+'" style="width:34px; height:34px; object-fit:contain;">'; }));

          (allExtrasComplete() ? '' :

    // v90: реальный баг - экран сертификата с v79 озвучивал фразу, для

  // v79: скачивание сертификата - основной путь через <a download>, но

  function downloadCertificatePDF(){

  function name_for_file(){

  // Вызывается после каждого правильно решённого задания (advanceAfterCorrect)

    saveProgress();
  }
  // v22: человекочитаемые названия видов заданий + группировка в
  // укрупнённые направления для шкалы прогресса в «Аналитике». Полный
  // список kind-строк — см. letterSubtypesForLevel()/numberSubtypesForLevel().
  var TASK_KIND_LABELS = {
    merge:'Слепи слог', trace:'Обводка букв', letterfind:'Найди букву', scheme:'Схема слова',
    wordbuild:'Собери слово', soundpick:'Угадай по звуку', syllablecount:'Сосчитай слоги', rhyme:'Рифма',
    tracenum:'Обводка цифр', neighbor:'Сосед числа', neighborrev:'Убывающий ряд', count:'Счёт предметов', seriate:'Порядок чисел',

  };
  var SKILL_BUCKETS = [
    {name:'Чтение и слова', kinds:['merge','scheme','wordbuild']},
    {name:'Звук и слух', kinds:['soundpick','syllablecount','rhyme']},
    {name:'Обводка (моторика)', kinds:['trace','tracenum']},
    {name:'Зрительное различение', kinds:['letterfind','neighbor','neighborrev','correctletter']},
    {name:'Счёт и числа', kinds:['count','seriate','compose','addition','subtraction','placevalue','shareequal']},
    {name:'Сравнение и знаки', kinds:['compare','sign','evenodd','oddonenum']}
  ];
  SKILL_BUCKETS[1].kinds.push('firstsound'); // «Звук и слух»
  // Короткая «этикетка» текущего задания (какая именно буква/слово/цифра),
  // чтобы в отчёте можно было сказать не просто «ошибался в обводке», а

  // есть один чёткий «предмет», тогда просто пусто.
  function currentTaskLabel(){
    var task = state.currentSet[state.roundIdx];
    if(!task) return '';
    if(task.item){
      if(task.item.ch) return task.item.ch;
      if(task.item.word) return task.item.word;
    }
    if(task.round){
      if(task.round.targetCh) return task.round.targetCh;
      if(task.round.word) return task.round.word;
    }
    return '';
  }
  // v22: единая точка записи в журнал аналитики — вызывается из
  // advanceAfterCorrect() ДО того, как счётчики текущего раунда сбросятся,
  // так что видит: сколько раз ошиблись в этом раунде, сколько заняло по
  // времени, был ли пропуск. «Угадывание наугад» — эвристика: 2+ ошибки
  // за раунд при очень маленьком среднем времени на попытку (ребёнок не
  // успевал бы прочитать/подумать) — сигнал для родителя, не точный факт.
  // v23: по прямой просьбе пользователя — «максимум пунктов для
  // последующего анализа». Расширенный набор полей (даже то, что пока не
  // выведено на сам экран отчёта) — чтобы будущие версии отчёта могли
  // строить графики по дням/времени суток/разделам без переделки журнала.
  var ANALYTICS_LETTER_KINDS = ['merge','trace','letterfind','scheme','wordbuild','soundpick','syllablecount','rhyme','correctletter','firstsound'];
  function pushAnalyticsEntry(){
    var timeMs = Date.now() - (state.roundStartTs || Date.now());
    var wrong = state.roundWrongCount || 0;
    var guessy = wrong >= 2 && (timeMs / (wrong + 1)) < 900;
    var now = new Date();
    var pad2 = function(n){ return n < 10 ? '0'+n : ''+n; };
    state.analyticsLog.push({
      ts: Date.now(),
      dateStr: now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate()),
      hour: now.getHours(),
      day: state.playDay,
      topic: state.curTopic,
      section: ANALYTICS_LETTER_KINDS.indexOf(state.curTopic) !== -1 ? 'letters' : 'numbers',
      label: currentTaskLabel(),
      wrongAttempts: wrong,
      timeMs: timeMs,
      skipped: !!state.roundWasSkipped,
      guessy: guessy,
      starEarned: !state.roundWasSkipped,
      streakAtTime: state.streak,
      lettersOnlyModeOn: !!state.lettersOnlyMode
    });

    rebuildDailyStats();
  }
  // v28: state.dailyStats пересчитывается целиком из state.analyticsLog
  // (а не копится инкрементально) — так «Очистить аналитику» за любой
  // период (час/день/месяц) не может рассинхронизировать дневную сводку
  // с самим логом: после удаления части записей просто зовём это снова.
  function rebuildDailyStats(){
    var ds = {};
    state.analyticsLog.forEach(function(e){
      if(!e.dateStr) return;
      var d = ds[e.dateStr] || (ds[e.dateStr] = {count:0, firstTry:0, wrongSum:0, skipped:0, timeMs:0, stars:0});
      d.count++;
      if(e.wrongAttempts===0 && !e.skipped) d.firstTry++;
      d.wrongSum += e.wrongAttempts;
      if(e.skipped) d.skipped++;
      d.timeMs += e.timeMs;
      if(e.starEarned) d.stars++;
    });
    state.dailyStats = ds;
  }
  // v28: по прямой просьбе пользователя — «Очистить аналитику» с выбором
  // периода. «Час»/«месяц» — скользящее окно от текущего момента (по
  // ts); «сегодня» — по календарной дате (dateStr); «всю» — полностью,
  // заодно и alphabetStats (у него нет истории по времени, только
  // счётчики, поэтому частичная очистка по периоду его не трогает).
  function clearAnalytics(range){
    var now = Date.now();
    if(range === 'all'){
      state.analyticsLog = [];
      state.alphabetStats = {visits:0, listens:0, letters:{}};
    } else if(range === 'hour'){
      state.analyticsLog = state.analyticsLog.filter(function(e){ return (now - e.ts) >= 3600000; });
    } else if(range === 'today'){
      var pad2 = function(n){ return n < 10 ? '0'+n : ''+n; };
      var d = new Date();
      var todayStr = d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
      state.analyticsLog = state.analyticsLog.filter(function(e){ return e.dateStr !== todayStr; });
    } else if(range === 'month'){
      state.analyticsLog = state.analyticsLog.filter(function(e){ return (now - e.ts) >= 30*24*3600000; });
    }
    rebuildDailyStats();
    saveProgress();
  }
  function showClearAnalyticsModal(){
    showInfoModal(
      '<h3>🗑️ Очистить аналитику</h3>'+
      '<p style="color:var(--ink-soft); font-size:.85rem;">Выберите период — данные за него удалятся безвозвратно.</p>'+
      '<div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px;">'+
        '<button class="session-min-btn" data-action="clear-analytics" data-range="hour">За последний час</button>'+
        '<button class="session-min-btn" data-action="clear-analytics" data-range="today">За сегодня</button>'+
        '<button class="session-min-btn" data-action="clear-analytics" data-range="month">За месяц</button>'+
        '<button class="session-min-btn" style="background:linear-gradient(155deg,var(--coral),var(--coral-deep)); color:#fff;" data-action="clear-analytics" data-range="all">Всю</button>'+
      '</div>'

  // v24: единая точка учёта визитов в «Алфавит» — по прямой просьбе
  // пользователя («заходила в алфавит — данных в аналитике нет»).
  function logAlphabetEvent(kind, ch){
    if(kind === 'view') state.alphabetStats.visits = (state.alphabetStats.visits||0) + 1;
    else if(kind === 'letter' && ch) state.alphabetStats.letters[ch] = (state.alphabetStats.letters[ch]||0) + 1;
    else if(kind === 'listen') state.alphabetStats.listens = (state.alphabetStats.listens||0) + 1;
    saveProgress();
  }
  // v22: считает агрегаты по всему журналу для экрана «Аналитика».
  // Оценка «лёгкости» вида задания (0..1, чем выше — тем увереннее
  // получается): доля раундов без ошибок и без пропуска, с штрафом за
  // среднее число ошибок на попытку.
  function computeAnalytics(){
    var log = state.analyticsLog || [];
    var perKind = {};
    log.forEach(function(e){
      var k = perKind[e.topic] || (perKind[e.topic] = {count:0, wrongSum:0, timeSum:0, skipped:0, guessy:0, items:{}});
      k.count++;
      k.wrongSum += e.wrongAttempts;
      k.timeSum += e.timeMs;
      if(e.skipped) k.skipped++;
      if(e.guessy) k.guessy++;
      if(e.label && e.wrongAttempts > 0) k.items[e.label] = (k.items[e.label]||0) + 1;
    });
    function kindAccuracy(k){ return k.count ? Math.max(0, Math.round(((k.count - k.wrongSum*0.5 - k.skipped) / k.count) * 100)) : null; }
    var kindsWithData = Object.keys(perKind).filter(function(k){ return perKind[k].count >= 2; });
    kindsWithData.sort(function(a,b){ return kindAccuracy(perKind[a]) - kindAccuracy(perKind[b]); });
    var buckets = SKILL_BUCKETS.map(function(b){
      var count=0, wrongSum=0, skipped=0;
      b.kinds.forEach(function(k){ var pk = perKind[k]; if(pk){ count += pk.count; wrongSum += pk.wrongSum; skipped += pk.skipped; } });
      var accuracy = count ? Math.max(0, Math.round(((count - wrongSum*0.5 - skipped) / count) * 100)) : null;
      return {name:b.name, count:count, accuracy:accuracy};
    });
    // v25: по прямой просьбе пользователя — «сохраняй отчёты по датам».
    // Раньше бралось из подрезаемого analyticsLog (терял старые дни при
    // подрезке до 500 записей); теперь — из постоянного state.dailyStats,
    // который копится параллельно и никогда не подрезается.
    var dailyActivity = Object.keys(state.dailyStats||{}).sort().reverse().slice(0,14).map(function(d){
      var s = state.dailyStats[d];

    });
    // По разделам (буквы/цифры) — виден перекос интереса или сложности.
    var bySection = {letters:{count:0,wrongSum:0,skipped:0}, numbers:{count:0,wrongSum:0,skipped:0}};
    log.forEach(function(e){ var s = bySection[e.section]; if(s){ s.count++; s.wrongSum += e.wrongAttempts; if(e.skipped) s.skipped++; } });

      var d = bySection[s];
      sectionAccuracy[s] = d.count ? Math.max(0, Math.round(((d.count - d.wrongSum*0.5 - d.skipped)/d.count)*100)) : null;
    });

      if(typeof e.hour !== 'number') return; // старые записи без часа — пропускаем, не «ночь» по умолчанию

      }
    });
    return {
      perKind: perKind,
      totalAttempts: log.length,
      totalFirstTry: log.filter(function(e){ return e.wrongAttempts===0 && !e.skipped; }).length,
      totalSkipped: log.filter(function(e){ return e.skipped; }).length,
      totalTimeMs: log.reduce(function(s,e){ return s+e.timeMs; }, 0),
      totalStars: log.filter(function(e){ return e.starEarned; }).length,
      bestStreak: log.reduce(function(m,e){ return Math.max(m, e.streakAtTime||0); }, 0),
      guessyEntries: log.filter(function(e){ return e.guessy; }),
      hardestKind: kindsWithData[0] || null,
      easiestKind: kindsWithData.length ? kindsWithData[kindsWithData.length-1] : null,
      kindAccuracy: kindAccuracy,
      buckets: buckets,
      dailyActivity: dailyActivity,
      sectionAccuracy: sectionAccuracy,
      bestPeriod: bestPeriod,
      alphabet: state.alphabetStats || {visits:0, listens:0, letters:{}},

      levelsTotal: LEVEL_COUNT
    };
  }

  // v22: по прямой просьбе пользователя — экран-отчёт для родителя. Что

      var tough = Object.keys(pk.items).sort(function(x,y){ return pk.items[y]-pk.items[x]; }).slice(0,3);
      return {label: TASK_KIND_LABELS[k]||k, acc:acc, count:pk.count, avgSec:avgSec, skipped:pk.skipped, tough:tough};

        // v36: по прямой просьбе пользователя — аналитика называла слабое

  // «Это картинка, а не эмодзи-заглушка?» — раньше проверялось по префиксу
  // 'data:', теперь учитываются и ссылки на файлы.
  function isImgSrc(s){ return typeof s === 'string' && /^(data:|img\/|blob:|https?:\/\/)/.test(s); }
  // Когда картинка уже подгружена в память (prefetchImages), берём blob-ссылку:
  // она показывается мгновенно и не зависит от кэш-заголовков хостинга.
  var ICON_CACHE = {};
  function imgSrc(s){ return ICON_CACHE[s] || s; }
  function prefetchImages(){
    try{
      var conn = navigator.connection || {};
      if(conn.saveData) return;
      var urls = [];
      Object.keys(ICONS).forEach(function(k){
        // фоны сертификата большие (≈0,6 МБ каждый) и нужны один раз — не грузим впрок
        if(/^cert_bg_/.test(k)) return;
        var u = ICONS[k];
        if(isImgSrc(u) && u.indexOf('img/') === 0 && urls.indexOf(u) === -1) urls.push(u);
      });
      var next = 0, running = 0, MAX = 4;
      function pump(){
        while(running < MAX && next < urls.length){
          (function(u){
            running++;
            // имя файла = хэш содержимого, поэтому «старый» кэш безопасен: force-cache
            fetch(u, {cache:'force-cache'})
              .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.blob(); })
              .then(function(b){ ICON_CACHE[u] = URL.createObjectURL(b); })
              .catch(function(){})
              .then(function(){ running--; pump(); });
          })(urls[next++]);
        }
      }
      pump();
    }catch(e){}
  }

  // Manual check button on a trace round (letter/digit) — a short
  // synthesized tone (Web Audio, not a recorded phrase) tells the child
  // pass/fail without waiting for the auto-detect-while-drawing path.
  function playTone(success){
    if(!state.sound) return;
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      g.gain.value = 0.16;
      o.connect(g); g.connect(ctx.destination);
      var now = ctx.currentTime;
      if(success){
        o.frequency.setValueAtTime(660, now);
        o.frequency.exponentialRampToValueAtTime(1320, now+0.18);
      } else {
        o.frequency.setValueAtTime(220, now);
        o.frequency.exponentialRampToValueAtTime(140, now+0.3);
      }
      o.start(now);
      o.stop(now + (success?0.3:0.38));
      o.onended = function(){ try{ ctx.close(); }catch(e){} };
    }catch(e){}
  }

  // Озвучка лежит отдельными файлами (audio/*.mp3), а не внутри index.html —
  // благодаря этому страница стартует в разы быстрее. Чтобы звук всё равно играл
  // мгновенно, после старта фоном (по 4 файла за раз, интерфейс не блокируется)
  // фразы подгружаются в память и играют из blob-ссылок. Пока фраза не
  // догрузилась — играет обычная сетевая ссылка. В режиме экономии трафика
  // фоновая подгрузка отключена (звук грузится по мере надобности).
  var AUDIO_CACHE = {};
  function prefetchAudio(){
    try{
      var conn = navigator.connection || {};
      if(conn.saveData) return;
      var keys = Object.keys(AUDIO_BANK), next = 0, running = 0, MAX = 4;
      function pump(){
        while(running < MAX && next < keys.length){
          (function(k){
            running++;
            // имя файла = хэш содержимого, поэтому force-cache безопасен (без перепроверок)
            fetch(AUDIO_BANK[k], {cache:'force-cache'})
              .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.blob(); })
              .then(function(b){ AUDIO_CACHE[k] = URL.createObjectURL(b); })
              .catch(function(){})
              .then(function(){ running--; pump(); });
          })(keys[next++]);
        }
      }
      pump();
    }catch(e){}
  }
  function unlockAudioOnce(){

        var p = bankAudioEl.play();
        if(p && p.then) p.then(function(){ bankAudioEl.pause(); }).catch(function(){});
      }
    }catch(e){}
    document.removeEventListener('pointerdown', unlockAudioOnce);

  // v86: по прямой просьбе пользователя - критичный баг очереди звуков.
  // Раньше КАЖДЫЙ speak(...,{queue:true}), вызванный пока играет другой
  // звук, вешал СВОЙ СОБСТВЕННЫЙ одноразовый слушатель 'ended' на общий
  // <audio>. Если несколько queue:true вызовов происходили подряд
  // синхронно (как в цепочке "звание -> награда -> достижение" после
  // уровня), все слушатели копились на ОДНОМ будущем событии 'ended' и
  // срабатывали разом, один за другим, синхронно - каждый тут же
  // перезаписывал .src поверх предыдущего, толком не дав ему начать
  // звучать. В итоге озвучивался только САМЫЙ ПОСЛЕДНИЙ добавленный в
  // очередь звук, а всё, что было перед ним (само звание!), пропадало
  // молча - именно это выглядело как "звание перепутано с наградой".
  // Теперь настоящая FIFO-очередь (speakQueue) с ОДНИМ постоянным
  // обработчиком 'ended', который проигрывает следующий элемент по
  // очереди, а не гонку одноразовых слушателей.
  var speakQueue = [];
  var speakBusy = false;
  // v95: по прямой просьбе пользователя - "звания не читаются" (снова, уже
  // ПОСЛЕ фикса v94 с задержкой кнопок). Реальная вторая причина: имя
  // звания играло ВТОРЫМ в очереди, а play() для очередного (queue:true)
  // клипа вызывается не из клика ребёнка, а изнутри обработчика 'ended' -
  // на части устройств/браузеров это менее надёжный путь для запуска
  // звука, чем прямой вызов play() из настоящего клика. Один ретрай на
  // отказ (иногда это просто временная накладка при быстрой смене .src) +
  // ниже порядок фраз в renderDayComplete() поменян местами, чтобы САМОЕ
  // важное (имя звания) всегда играло ПЕРВЫМ, самым надёжным прямым
  // вызовом, а не вторым через цепочку.
  function playBankAudio(src, isRetry){
    speakBusy = true;
    bankAudioEl.src = src;
    bankAudioEl.currentTime = 0;
    bankAudioEl.volume = 1;
    var p = bankAudioEl.play();
    if(p && p.then){
      p.then(function(){ soundDiag = {ok:true, msg:'воспроизведение началось успешно'}; })
       .catch(function(err){
         if(!isRetry){ playBankAudio(src, true); return; }
         soundDiag = {ok:false, msg:'play() отклонён: '+(err && (err.name+': '+err.message) || err)};
         speakBusy = false;
       });
    } else {
      soundDiag = {ok:true, msg:'play() вызван (без промиса)'};
    }
  }
  function speak(text, opts){
    opts = opts || {};
    if(state.lettersOnlyMode && !opts.core) return;
    if(!opts.transient) state.lastSpeech = text;
    if(!state.sound){ soundDiag = {ok:false, msg:'звук выключен тумблером (сброшено state.sound)'}; return; }
    var recorded = AUDIO_BANK[text];
    if(!recorded){ soundDiag = {ok:false, msg:'нет записи для фразы: «'+text+'»'}; return; }
    if(AUDIO_CACHE[text]) recorded = AUDIO_CACHE[text];   // уже в памяти — играет без сети
    try{
      if(!bankAudioEl){
        bankAudioEl = new Audio();
        bankAudioEl.addEventListener('ended', function(){
          if(speakQueue.length){ playBankAudio(speakQueue.shift()); }
          else { speakBusy = false; }
        });
      }
      if(opts.queue && speakBusy){
        speakQueue.push(recorded);
      } else {
        speakQueue.length = 0;
        bankAudioEl.pause();
        playBankAudio(recorded);
      }
    }catch(e){ soundDiag = {ok:false, msg:'исключение: '+e}; }
  }

  function burstStars(fromEl, n){

  // Real Pixar-style illustration supplied by the user (resized/compressed to
  // ~16KB webp) replaces the earlier hand-coded SVG placeholder.
  var FOX_IMG = 'img/ebdb74052e50.webp';
  LEVEL_BADGE_ICON[24] = FOX_IMG; // v15: «Хранитель Академии» (финал) -> сам Рыжик

  /* =================== ПОВТОРЕНИЕ (v36) ===================
     По прямой просьбе пользователя, после критики «нет отложенного
     повторения — пройденный материал не возвращается». Не трогает
     основной движок уровней (state.currentSet/dayDone/levelProgress) —
     полностью отдельный, самодостаточный мини-режим поверх уже
     накопленной аналитики, так безопаснее: сломать основной прогресс
     невозможно, максимум — показать мало или совсем ничего, если
     аналитика пуста. Источник — state.analyticsLog (уже ведётся, просто
     раньше никто, кроме родителя, его не читал). */
  function findLetterItem(ch){
    for(var i=0;i<LETTERS.length;i++){ if(LETTERS[i].ch === ch) return LETTERS[i]; }
    return null;
  }
  function findWordItem(word){
    for(var lv=0; lv<READING_ITEMS_BY_LEVEL.length; lv++){
      var arr = READING_ITEMS_BY_LEVEL[lv];
      for(var i=0;i<arr.length;i++){ if(arr[i].word === word) return arr[i]; }
    }
    return null;
  }
  // Приоритет — то, что чаще давало ошибку и/или давно не встречалось
  // (меньше ts = выше приоритет при равном числе ошибок).
  function buildReviewPool(){
    var byLabel = {};
    state.analyticsLog.forEach(function(e){
      if(!e.label || e.section !== 'letters') return;
      var cur = byLabel[e.label];
      if(!cur){ cur = {wrongAttempts:0, lastTs:0}; byLabel[e.label] = cur; }
      cur.wrongAttempts += (e.wrongAttempts||0);
      cur.lastTs = Math.max(cur.lastTs, e.ts||0);
    });
    var items = [];
    Object.keys(byLabel).forEach(function(label){
      var meta = byLabel[label];
      if(label.length === 1){
        var l = findLetterItem(label);
        if(l) items.push({type:'letter', ch:l.ch, wrongAttempts:meta.wrongAttempts, lastTs:meta.lastTs});
      } else {
        var w = findWordItem(label);
        if(w) items.push({type:'word', word:w.word, emoji:w.emoji, wrongAttempts:meta.wrongAttempts, lastTs:meta.lastTs});
      }
    });
    items.sort(function(a,b){
      var scoreA = a.wrongAttempts*1e13 - a.lastTs, scoreB = b.wrongAttempts*1e13 - b.lastTs;
      return scoreB - scoreA;
    });
    return items.slice(0, 10);
  }
  function startReviewSession(){
    if(!canAccessReview()){ renderPaywallScreen(paywallReason()); return; }
    var pool = buildReviewPool();
    if(pool.length === 0){
      showToast('Пока нечего повторять — сначала пройдите хотя бы один урок!');
      return;
    }
    state.reviewQueue = shuffle(pool);
    state.reviewIdx = 0;
    state.reviewCorrect = 0;
    renderReviewRound();
  }
  function renderReviewRound(){

    var item = state.reviewQueue[state.reviewIdx];

      var wDistractors = shuffle(allWords).slice(0,2);
      var wOptions = shuffle([{word:item.word, emoji:item.emoji, correct:true}].concat(wDistractors.map(function(w){ return {word:w.word, emoji:w.emoji, correct:false}; })));
      speech = 'Помнишь это слово? Найди картинку!';
      body =
        '<p style="font-weight:800; font-size:1.1rem;">Где спряталось слово «'+item.word+'»?</p>'+
        '<div class="choice-grid">'+
          wOptions.map(function(o){ return '<button class="choice-btn" data-action="review-answer" data-correct="'+(o.correct?'1':'0')+'" data-word-sound="'+o.word.toLowerCase()+'">'+mediaTag(o.emoji,'choice-pic')+'</button>'; }).join('')+

          '<span class="domain-tag tag-read">Повторение</span>'+
          body+
        '</div>'+
        '<div class="next-row" id="reviewNextRow" hidden><button class="fab" style="background:linear-gradient(155deg,var(--leaf),var(--leaf-deep)); box-shadow:0 16px 30px -14px rgba(34,163,135,.65);" data-action="review-next" aria-label="Далее">'+btnIcon(ICONS.btn_next)+'</button></div>'+
        '<button class="mascot-row" style="margin-top:14px;" data-action="replay" aria-label="Повторить">'+
          '<div class="mascot-wrap" style="width:52px;height:52px;"><div class="mascot">'+foxSvg()+'</div><div class="replay-badge">'+mediaTag(ICONS.break_repeat, 'replay-badge-img')+'</div></div>'+
          '<div class="bubble">'+speech+'</div>'+

  function handleReviewAnswer(el){
    var siblings = el.parentElement.querySelectorAll('button');
    if(el.dataset.correct === '1'){

  /* =================== LESSON BUILDER =================== */

  var BATCH_SIZE = 3;

  // Picks an index from `pool` not yet used in this batch (falls back to
  // allowing a repeat only once the whole pool has been exhausted).
  function pickUnused(pool, usedArr){
    var avail = [];
    for(var i=0;i<pool.length;i++){ if(usedArr.indexOf(i) === -1) avail.push(i); }
    if(avail.length === 0){ avail = []; for(var j=0;j<pool.length;j++) avail.push(j); }
    var idx = pick(avail);
    usedArr.push(idx);
    return pool[idx];
  }
  function buildOneTask(sub, lv, usedBySub){
    if(sub === 'merge'){
      usedBySub.merge = usedBySub.merge || [];
      return {kind:'merge', item: pickUnused(READING_ITEMS_BY_LEVEL[lv-1], usedBySub.merge)};
    }
    if(sub === 'scheme'){
      usedBySub.scheme = usedBySub.scheme || [];
      return {kind:'scheme', item: pickUnused(SOUND_WORDS_BY_LEVEL[lv-1], usedBySub.scheme)};
    }
    if(sub === 'trace'){
      usedBySub.trace = usedBySub.trace || [];
      // v35: по прямой просьбе пользователя — буква Ы совсем убрана из
      // ЗАДАНИЯ «Обведи букву» (два раздельных штриха плохо ложатся на
      // экранную точка-в-точку обводку). В остальных заданиях с буквами
      // (letterfind/correctletter/firstsound и т.д.) Ы остаётся — там она
      // показывается текстом, а не точками, и проблемы не было.
      var tracePool = LETTERS.slice(0, traceUnlockForLevel(lv)).filter(function(l){ return l.ch !== 'Ы'; });
      return {kind:'trace', item: pickUnused(tracePool, usedBySub.trace)};
    }
    if(sub === 'tracenum'){
      usedBySub.tracenum = usedBySub.tracenum || [];
      return {kind:'tracenum', item: pickUnused(NUMBERS.slice(0, digitUnlockForLevel(lv)), usedBySub.tracenum)};
    }
    // v6: 2 принципиально новых вида заданий (не разновидности старых).
    // v32: letterfind тоже без повторов внутри уровня (usedBySub).
    if(sub === 'letterfind'){ return {kind:'letterfind', round: genLetterFindRound(lv, usedBySub)}; }
    if(sub === 'neighbor'){ return {kind:'neighbor', round: genNeighborRound(lv)}; }
    if(sub === 'neighborrev'){ return {kind:'neighbor', round: genNeighborRound(lv, true)}; }
    // v7: ещё 2 принципиально новых вида (с 5 уровня) — «Собери слово»
    // берёт слово из того же пула, что и «Слепи слог» (пул уровня,
    // отдельный трекинг usedBySub.wordbuild, чтобы не путать прогресс).
    if(sub === 'wordbuild'){
      usedBySub.wordbuild = usedBySub.wordbuild || [];
      return {kind:'wordbuild', item: pickUnused(READING_ITEMS_BY_LEVEL[lv-1], usedBySub.wordbuild)};
    }
    // v13: ещё 2 принципиально новых вида (с 20 уровня) — «Сосчитай слоги».
    if(sub === 'syllablecount'){ return {kind:'syllablecount', round: genSyllableCountRound(lv, usedBySub)}; }
    // v13: с 25 уровня — «Рифма».
    if(sub === 'rhyme'){ return {kind:'rhyme', round: genRhymeRound(lv, usedBySub)}; }
    if(sub === 'soundpick'){ return {kind:'soundpick', round: genSoundPickRound(lv, usedBySub)}; }
    // v26: 4 новых вида — см. генераторы ниже (после handleWordBuildAnswer).
    if(sub === 'correctletter'){ return {kind:'correctletter', round: genCorrectLetterRound(lv, usedBySub)}; }
    if(sub === 'firstsound'){ return {kind:'firstsound', round: genFirstSoundRound(lv, usedBySub)}; }
    if(sub === 'shareequal'){ return {kind:'shareequal', round: genShareEqualRound(lv)}; }
    if(sub === 'oddonenum'){ return {kind:'oddonenum', round: genOddOneNumRound(lv)}; }
    return {kind:sub, round: genMathRoundOfType(sub, lv)};
  }
  // v32: по прямой просьбе пользователя — «не более 20% повторов слов
  // внутри уровня, особенно в режиме только-буквы/только-цифры». Честный
  // round-robin вместо IID pick(subs): раньше случайный выбор мог по
  // невезению отдать одному виду заданий гораздо больше раундов, чем
  // другим, и его небольшой словарный пул быстро зацикливался. Теперь
  // всегда выбирается вид(ы) с МИНИМАЛЬНЫМ числом использований в этом
  // уровне — жёстко ограничивает, сколько раз подряд может спрашиваться
  // один вид, а pickUnused() внутри каждого вида не даст повториться
  // самому слову/букве, пока не исчерпан весь его пул.
  function pickFairSubtype(subs, usage){
    var counts = subs.map(function(s){ return usage[s]||0; });
    var minCount = Math.min.apply(null, counts);
    var leastUsed = subs.filter(function(s){ return (usage[s]||0) === minCount; });
    var chosen = pick(leastUsed);
    usage[chosen] = (usage[chosen]||0) + 1;
    return chosen;
  }
  // v5f: tracking now lives on state.usedWordsBySub (level-scoped, reset
  // only in startDay) instead of a fresh object per batch — a word/letter
  // no longer repeats until every item in its pool has appeared once,
  // across the WHOLE level, not just within one 3-task batch.
  function buildTopicTasks(sectionKey, size){
    var lv = state.playDay;
    var subs = subtypesForSection(sectionKey, lv);
    var tasks = [];
    state.subtypeUsage = state.subtypeUsage || {};
    for(var i=0;i<size;i++) tasks.push(buildOneTask(pickFairSubtype(subs, state.subtypeUsage), lv, state.usedWordsBySub));
    return tasks;
  }

  // v5f: resumes a level's saved progress if there is one (see
  // advanceAfterCorrect), otherwise starts it fresh — either way this is
  // the ONLY place that (re)initialises a level's in-progress state.
  function startDay(day){
    if(!canAccessLevel(day)){ renderPaywallScreen(paywallReason()); return; }
    state.playDay = day;
    state.newlyUnlocked = [];
    var lp = state.levelProgress[day];
    // v91: по прямой просьбе пользователя - если ребёнок возвращается на
    // УЖЕ пройденный уровень (например, добрать недостающие
    // награды/достижения), сохранённый lp.dayDone равен полной длине
    // уровня - без этой проверки хаб покажет "осталось 0" и первый же
    // верный ответ немедленно повторно завершит уровень, не дав реально
    // поиграть. Общий прогресс (звёзды/награды/достижения) это НЕ
    // трогает - он всегда глобальный и тут не участвует.
    if(lp && lp.dayDone >= levelLenForLevel(day)) lp = null;
    if(lp){
      state.dayDone = lp.dayDone || 0;
      state.roundsSinceBreak = lp.roundsSinceBreak || 0;
      state.roundStars = lp.roundStars || 0;
      state.topicDone = lp.topicDone || {};
      state.todayMistakes = lp.todayMistakes || {};
      state.usedWordsBySub = lp.usedWordsBySub || {};
      state.subtypeUsage = lp.subtypeUsage || {};
      state.usedBreakExercises = lp.usedBreakExercises || [];
    } else {
      state.dayDone = 0;
      state.roundsSinceBreak = 0;
      state.roundStars = 0;
      state.topicDone = {};
      state.todayMistakes = {};
      state.usedWordsBySub = {};
      state.subtypeUsage = {};
      state.usedBreakExercises = [];
    }
    renderDayHub();
  }

  var HUB_GREETS = [
    'Выбери, чем хочешь позаниматься!',
    'Что будем сегодня делать?',
    'Куда отправимся — выбирай!',

    'Выбирай задание, и начинаем!'

  function renderDayHub(){

    var lv = state.playDay;

    }).join('');
    var levelLen = levelLenForLevel(lv);
    var dots = '';
    for(var i=0;i<levelLen;i++) dots += '<div class="pdot '+(i<state.dayDone?'done':'')+'"></div>';
    var progressText = '<p class="progress-count">Сделано '+state.dayDone+' из '+levelLen+' · осталось '+(levelLen-state.dayDone)+' до следующего уровня</p>';
    var speech = pick(HUB_GREETS);
    $('#app').innerHTML =
      '<div class="topbar">'+
        '<button class="icon-btn" data-action="go-home" aria-label="На полку">'+btnIcon(ICONS.btn_home)+'</button>'+
        '<div class="topbar-mid">'+
          '<button class="stars-pill" data-action="show-stars-info"><span class="star-ic">⭐</span><span id="starCount">'+state.stars+'</span></button>'+
          sessionTimerPillHtml()+
        '</div>'+
        '<button class="icon-btn" data-action="toggle-sound" aria-label="Звук">'+btnIcon(state.sound?ICONS.btn_sound_on:ICONS.btn_sound_off)+'</button>'+
      '</div>'+
      '<div class="progress-row">'+dots+'</div>'+
      progressText+
      '<button class="mascot-row" data-action="replay" aria-label="Повторить">'+
