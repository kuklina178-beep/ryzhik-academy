<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Совёнок Тим</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root {
  --bg: #FEF7E8; --cream: #FEF7E8; --surface: #FFFFFF; --surface-2: #F6F9F1; --ink: #1D2742; --ink-soft: #5B6680; --line: #DCE5D2;
  --tangerine: #FF7A3D; --tangerine-deep: #E0601F; --jade: #22B89A; --jade-soft: #D6F5EC;
  --sun: #FFCB2E; --sun-soft: #FFF3C7; --berry: #FF5C8A; --berry-soft: #FFE1EA; --sky: #4DA8FF; --sky-soft: #DDEEFF;
  --night: #1D2742;
  --shadow: 0 1px 0 rgba(29,39,66,.04), 0 10px 26px -12px rgba(29,39,66,.25);
  --display: "Unbounded", "Nunito", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
img { display: block; max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; }
.screen { flex: 1; overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 20px; display: flex; flex-direction: column; gap: 14px; }

/* верхняя строка */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--cream); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 6px; font-weight: 900; font-size: 15px; white-space: nowrap; }
.chip img { width: 24px; height: 24px; }
.icon-btn { width: 42px; height: 42px; border-radius: 14px; background: var(--cream); border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.icon-btn img { width: 28px; height: 28px; }
.tpill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 11px; font-weight: 900; font-size: 15px; font-variant-numeric: tabular-nums; }
.tpill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sky); }
.tpill.warn { color: var(--berry); border-color: var(--berry); animation: blink 1s step-start infinite; }
.tpill.warn::before { background: var(--berry); }
@keyframes blink { 50% { opacity: .4; } }

/* главная */
.hello { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hello b { font-family: var(--display); font-size: 18px; display: block; line-height: 1.15; }
.hello span { font-size: 13px; color: var(--ink-soft); font-weight: 700; }
.hero { position: relative; background: var(--cream); color: var(--ink); border: 2px solid var(--line); border-radius: 28px; padding: 18px 16px; min-height: 200px; overflow: hidden; }
.hero::before { content: none; }
.hero::after { content: none; }
.hero .owl { position: absolute; right: 4px; bottom: 0; width: 165px; height: 165px; object-fit: contain; }
.hero .eyebrow { position: relative; color: var(--ink-soft); font-weight: 900; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.bubble { position: relative; background: #fff; border: 2px solid var(--line); color: var(--ink); border-radius: 18px 18px 18px 6px; padding: 10px 12px; font-weight: 800; font-size: 15px; line-height: 1.3; max-width: 58%; margin-top: 54px; }
.btn-main { width: 100%; background: var(--tangerine); color: #fff; border-radius: 22px; padding: 16px; font-family: var(--display); font-weight: 800; font-size: 22px; box-shadow: 0 5px 0 var(--tangerine-deep); transition: transform .1s, box-shadow .1s; display: grid; gap: 2px; }
.btn-main small { font-family: var(--body); font-weight: 800; font-size: 14px; opacity: .92; }
.btn-main:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tangerine-deep); }
.btn-main:disabled { background: #C9CFD9; box-shadow: 0 5px 0 #AEB5C2; }
.btn-ghost { width: 100%; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 14px; font-weight: 900; font-size: 17px; }
.row-info { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 800; color: var(--ink-soft); }
.dots { display: flex; gap: 6px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--tangerine); }
.dots i.off { background: var(--line); }
.card { background: var(--cream); border: 1.5px solid var(--line); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); }
.next { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; }
.next img { width: 64px; height: 64px; border-radius: 14px; }
.next b { font-weight: 900; }
.bar { height: 12px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1.5px solid var(--line); margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--sun); border-radius: 99px; }
.next small { display: block; color: var(--ink-soft); font-weight: 700; margin-top: 4px; }

/* таббар */
.tabbar { display: grid; grid-template-columns: repeat(3, 1fr); padding: 8px 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--cream); border-top: 1.5px solid var(--line); }
.tab { display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 900; color: var(--ink-soft); }
.tab span.ic { width: 52px; height: 32px; border-radius: 14px; display: grid; place-items: center; }
.tab img { width: 28px; height: 28px; }
.tab.on { color: var(--ink); }
.tab.on span.ic { background: var(--sun-soft); } .tab.on img { mix-blend-mode: multiply; }

/* карта */
.map { display: flex; flex-direction: column; gap: 6px; padding-bottom: 8px; }
.isle { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 12px; width: 82%; }
.isle:nth-child(even) { align-self: flex-end; grid-template-columns: 1fr 112px; text-align: right; }
.isle:nth-child(even) .isle-pic { order: 2; }
.isle-pic { width: 112px; height: 112px; position: relative; }
.isle-pic img.i { width: 100%; height: 100%; }
.isle-pic img.owl { position: absolute; width: 62px; height: 62px; right: -14px; top: -14px; }
.isle b { font-family: var(--display); font-size: 15px; display: block; }
.isle small { font-weight: 800; color: var(--ink-soft); }
.isle.closed .isle-pic img.i { filter: grayscale(1); opacity: .45; }
.isle.now .isle-pic::before { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: radial-gradient(circle, var(--sun-soft) 0 62%, transparent 63%); z-index: -1; }
.isle .tick { color: var(--jade); }

/* игра */
.game-top { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; }
.pebbles { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.pebbles i { height: 10px; border-radius: 99px; background: var(--line); }
.pebbles i.ok { background: var(--jade); }
.pebbles i.half { background: var(--sun); }
.pebbles i.bad { background: var(--berry); }
.pebbles i.now { background: var(--tangerine); }
.q { background: var(--surface); border-radius: 26px; padding: 14px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.qmeta { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 800; color: var(--ink-soft); gap: 8px; }
.qmeta .topic { display: inline-flex; align-items: center; gap: 6px; }
.qmeta .topic img { width: 22px; height: 22px; }
.pic { background: var(--cream); border-radius: 20px; min-height: 150px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px; flex-wrap: wrap; }
.pic .main { width: 170px; height: 170px; }
.pic .seq { width: 54px; height: 54px; }
.pic .grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; background: var(--cream); border: 2px solid var(--line); border-radius: 16px; padding: 8px; max-width: 46%; }
.pic .grp img { width: 46px; height: 46px; }
.pic .plus { font-family: var(--display); font-size: 30px; color: var(--tangerine); }
.pic .remember { width: 100%; text-align: center; font-family: var(--display); font-size: 18px; }
.pic .emojirow { font-size: 40px; letter-spacing: 6px; }
.qtext { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.25; }
.speak { display: inline-flex; align-items: center; gap: 8px; background: var(--sky-soft); border-radius: 99px; padding: 6px 14px 6px 6px; font-weight: 900; font-size: 14px; justify-self: start; }
.speak i { width: 32px; height: 32px; border-radius: 50%; background: var(--sky); color: #fff; display: grid; place-items: center; font-style: normal; }
.speak.on i { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(77,168,255,.25); } }
.answers { display: grid; gap: 10px; }
.answers.grid2 { grid-template-columns: 1fr 1fr; }
.ans { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 12px; text-align: left; background: var(--cream); border: 2px solid var(--line); border-radius: 20px; padding: 8px 12px 8px 8px; font-weight: 900; font-size: 18px; box-shadow: 0 4px 0 var(--line); transition: transform .1s, box-shadow .1s, background .2s, border-color .2s, opacity .2s; min-height: 64px; }
.ans.noimg { grid-template-columns: 1fr; text-align: center; padding: 14px; }
.ans.emoji { font-size: 34px; }
.ans img { width: 76px; height: 76px; border-radius: 14px; }
.ans:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.ans.right img, .ans.wrong img { mix-blend-mode: multiply; } .ans.right { background: var(--jade-soft); border-color: var(--jade); box-shadow: 0 4px 0 var(--jade); }
.ans.wrong { background: var(--berry-soft); border-color: var(--berry); box-shadow: none; opacity: .5; animation: shake .35s; }
.ans.reveal { border-color: var(--jade); border-style: dashed; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.say { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: end; }
.say img { width: 64px; height: 64px; }
.say p { background: var(--night); color: #fff; border-radius: 18px 18px 18px 4px; padding: 10px 13px; font-weight: 800; font-size: 15px; line-height: 1.3; }
.say p b { color: var(--sun); }
.say.good p { background: var(--jade); }
.say.good p b { color: #fff; }

/* финал */
.result { align-items: center; text-align: center; }
.result .big { width: 200px; height: 200px; margin-top: 8px; }
.plus-stars { font-family: var(--display); font-weight: 800; font-size: 48px; color: var(--tangerine); display: flex; align-items: center; gap: 8px; }
.plus-stars img { width: 52px; height: 52px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.stat b { font-family: var(--display); font-size: 24px; display: block; }
.stat span { font-size: 13px; font-weight: 800; color: var(--ink-soft); }

/* родителям */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bento .wide { grid-column: 1 / -1; }
.k { font-size: 13px; font-weight: 800; color: var(--ink-soft); }
.v { font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.1; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-top: 8px; }
.week i { aspect-ratio: 1; border-radius: 7px; background: var(--surface-2); border: 1.5px solid var(--line); font-style: normal; font-size: 10px; font-weight: 900; display: grid; place-items: center; color: var(--ink-soft); }
.week i.on { background: var(--jade); border-color: var(--jade); color: #fff; }
.ring { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; margin-top: 6px; }
.ring b { width: 52px; height: 52px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 900; font-size: 15px; }
.trow { display: grid; grid-template-columns: 1fr 70px 42px; gap: 8px; align-items: center; font-size: 14px; font-weight: 800; padding: 5px 0; }
.trow .bar { margin: 0; height: 9px; }
.trow .bar > i { background: var(--jade); }
.trow.low .bar > i { background: var(--berry); }
.trow span:last-child { text-align: right; color: var(--ink-soft); }
.tip { background: var(--sky-soft); border-radius: 18px; padding: 12px; font-size: 14px; font-weight: 700; line-height: 1.4; }
.tip b { display: block; font-weight: 900; margin-bottom: 2px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; padding: 6px 0; }
.setting button { background: var(--surface-2); border: 1.5px solid var(--line); border-radius: 12px; padding: 7px 12px; font-weight: 900; font-size: 14px; }
.muted { color: var(--ink-soft); font-size: 13px; font-weight: 700; }

/* слои: выбор таймера, блокировка, вопрос взрослому, тост */
.layer { position: fixed; inset: 0; z-index: 20; background: rgba(29,39,66,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 28px 28px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; }
.sheet h3 { font-size: 19px; }
.sheet p { font-size: 14px; font-weight: 700; color: var(--ink-soft); line-height: 1.4; }
.mins { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mins button { background: var(--surface-2); border: 2px solid var(--line); border-radius: 16px; padding: 12px; font-weight: 900; font-size: 16px; }
.mins button.on { border-color: var(--tangerine); background: var(--sun-soft); }
.mins .wide { grid-column: 1 / -1; }
.lock { position: fixed; inset: 0; z-index: 30; background: var(--cream); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; padding: 24px; }
.lock .owl { width: 170px; height: 170px; }
.lock .zz { font-family: var(--display); font-weight: 800; color: var(--tangerine); font-size: 24px; letter-spacing: .12em; margin-bottom: -12px; }
.lock h2 { font-size: 24px; }
.lock p { font-weight: 700; font-size: 15px; color: var(--ink-soft); max-width: 28ch; }
.lock .btn-ghost { background: #fff; color: var(--ink); border-color: var(--line); max-width: 360px; }
.gate { width: 100%; max-width: 360px; display: grid; gap: 10px; background: #fff; border: 2px solid var(--line); color: var(--ink); border-radius: 22px; padding: 14px; }
.gate b { font-size: 14px; }
.gate .ex { font-family: var(--display); font-weight: 800; font-size: 28px; }
.gate input { width: 100%; font: inherit; font-weight: 900; font-size: 22px; text-align: center; border: 2px solid var(--line); border-radius: 14px; padding: 9px; color: var(--ink); background: var(--surface-2); }
.gate .err { color: #E0457A; font-weight: 800; font-size: 13px; min-height: 1.2em; }
.toast { position: fixed; left: 16px; right: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 40; background: var(--night); color: #fff; border-radius: 16px; padding: 12px 14px; font-weight: 800; font-size: 15px; box-shadow: var(--shadow); max-width: 528px; margin: 0 auto; }

/* имя */
.onboard { align-items: center; justify-content: center; text-align: center; gap: 16px; }
.onboard .owl { width: 190px; height: 190px; }
.onboard input { width: 100%; max-width: 340px; font: inherit; font-weight: 900; font-size: 22px; text-align: center; border: 2px solid var(--line); border-radius: 18px; padding: 12px; background: var(--surface); color: var(--ink); user-select: text; -webkit-user-select: text; }
.onboard .btn-main, .onboard .btn-ghost { max-width: 340px; }
.loading { flex: 1; display: grid; place-items: center; font-weight: 800; color: var(--ink-soft); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="loading">Совёнок Тим просыпается…</div></div>
<script src="data.js"></script>
<script>
(function () {
"use strict";
var D = window.TIM;
var tg = window.Telegram && window.Telegram.WebApp;
var $app = document.getElementById("app");
var IMG = function (k) { return "img/" + k + ".webp"; };
var MASCOT = {};
D.ui.mascot.forEach(function (k) { MASCOT[k.split("/")[1].replace(/^\d+_/, "")] = k; });
var M = function (pose) { return IMG(MASCOT[pose] || MASCOT.wave); };
var TASK_INDEX = {};
D.tasks.forEach(function (t, i) { TASK_INDEX[t.id] = i; });

/* ---------- время (по Москве) ---------- */
var DAY = 86400000;
function dayNum(ts) { return Math.floor(((ts || Date.now()) + 3 * 3600000) / DAY); }

/* ---------- хранилище: Telegram CloudStorage + запасная копия в localStorage ---------- */
var KEYS = ["core", "seen", "stats", "timer"];
var S = { core: null, seen: [], stats: {}, timer: null };
var cloudOk = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9"));
function lsGet(k) { try { return localStorage.getItem("tim_" + k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem("tim_" + k, v); } catch (e) {} }
function parse(v, def) { try { return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function load(cb) {
  function apply(vals) {
    S.core = parse(vals.core, null);
    S.seen = parse(vals.seen, []);
    S.stats = parse(vals.stats, {});
    S.timer = parse(vals.timer, null);
    cb();
  }
  var local = {};
  KEYS.forEach(function (k) { local[k] = lsGet(k); });
  if (!cloudOk) { apply(local); return; }
  var done = false;
  var t = setTimeout(function () { if (!done) { done = true; apply(local); } }, 2500);
  tg.CloudStorage.getItems(KEYS, function (err, vals) {
    if (done) return;
    done = true; clearTimeout(t);
    if (err || !vals) { apply(local); return; }
    // в облаке пусто, а на телефоне что-то есть — берём телефон
    KEYS.forEach(function (k) { if (!vals[k] && local[k]) vals[k] = local[k]; });
    apply(vals);
  });
}
function save(key) {
  var v = JSON.stringify(S[key]);
  lsSet(key, v);
  if (cloudOk) { try { tg.CloudStorage.setItem(key, v, function () {}); } catch (e) {} }
}
function core() {
  if (!S.core) S.core = { name: null, stars: 0, streak: 0, last: 0, gd: 0, gn: 0, lv: {}, voice: 1, asked: 0 };
  return S.core;
}

/* ---------- звук ---------- */
var player = new Audio();
player.preload = "auto";
var unlocked = false;
document.addEventListener("pointerdown", function () {
  if (unlocked) return;
  unlocked = true;
  // «разблокируем» плеер на iOS: дальше он играет и без касания
  player.src = "data:audio/mp3;base64,SUQzBAAAAAAAI1RTU0UAAAAPAAADTGF2ZjU4LjI5LjEwMAAAAAAAAAAAAAAA//tQxAADB8AhSmxhIIEVCSiJrDCQBTcu3UrAIwUdkRgQbFAZC1CQEwTJ9mjRvBA4UOLD8nKVOWfh+UlK3z/177OXrfOdKl7pyn3Xf//WreyTRUoAWgBgkOAGbZHBgG1OF6zM82DWbZaUmMBptgQhGjsyYqc9ae9XFz280948NMBWInljyzsNRFLPWdnZGWrddDsjK1unuSrVN9jJsK8KuQtQCtMBjCEtImISdNKJOopIpBFpNSMbIHCSRpRR5iakjTiyzLhchUUBwCgyKiweBv/7UsQbg8isVNoMPMjAAAA0gAAABEVFGmgqK////9bP/6XCykxBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq";
  var p = player.play(); if (p && p.catch) p.catch(function () {});
}, true);
var speakBtn = null;
function play(file) {
  if (!file || !core().voice) return;
  try {
    player.pause();
    player.src = "a/" + file;
    var p = player.play(); if (p && p.catch) p.catch(function () {});
    if (speakBtn) { speakBtn.classList.remove("on"); void speakBtn.offsetWidth; speakBtn.classList.add("on"); }
  } catch (e) {}
}
function haptic(kind) { try { tg.HapticFeedback.notificationOccurred(kind); } catch (e) {} }

/* ---------- утилиты ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function island(stars) { var r = D.islands[0], idx = 0; D.islands.forEach(function (x, i) { if (stars >= x[0]) { r = x; idx = i; } }); return { name: r[1], idx: idx }; }
function nextIsland(stars) { for (var i = 0; i < D.islands.length; i++) if (D.islands[i][0] > stars) return { need: D.islands[i][0], name: D.islands[i][1], idx: i }; return null; }

var BY_BLOCK = {};
D.tasks.forEach(function (t) { (BY_BLOCK[t.b] = BY_BLOCK[t.b] || []).push(t); });
function seenSet() { var s = {}, from = dayNum() - 14; S.seen.forEach(function (p) { if (p[1] >= from) s[p[0]] = 1; }); return s; }
function pickInBlock(block, level, seen, taken) {
  var pool = (BY_BLOCK[block] || []).filter(function (t) { return !taken[t.id]; });
  var conds = [
    function (t) { return t.l === level && !seen[TASK_INDEX[t.id]]; },
    function (t) { return t.l <= level && !seen[TASK_INDEX[t.id]]; },
    function (t) { return t.l <= level; },
    function () { return true; }
  ];
  for (var i = 0; i < conds.length; i++) { var c = pool.filter(conds[i]); if (c.length) return pick(c); }
  return null;
}
function neighboursOk(seq, strict) {
  for (var i = 1; i < seq.length; i++) {
    var a = seq[i - 1], b = seq[i];
    if (a.b === b.b) return false;
    if (strict && a.m === b.m && a.m !== "quiz") return false;
  }
  return true;
}
function buildSession() {
  var n = D.perSession, lv = core().lv, seen = seenSet();
  var others = shuffle(Object.keys(BY_BLOCK).filter(function (b) { return D.core.indexOf(b) < 0; }));
  var plan = D.core.concat(others); plan = plan.concat(plan).slice(0, n);
  var chosen = [], taken = {};
  plan.forEach(function (b) { var t = pickInBlock(b, (lv[b] || [1])[0], seen, taken); if (t) { chosen.push(t); taken[t.id] = 1; } });
  for (var strict = 1; strict >= 0; strict--) for (var k = 0; k < 300; k++) { shuffle(chosen); if (neighboursOk(chosen, !!strict)) return chosen; }
  return chosen;
}
function updateLevel(block, result) {

  if (result === 2) { x[1]++; x[2] = 0; } else if (result === 0) { x[1] = 0; x[2]++; } else x[1] = 0;
  if (x[1] >= 3 && x[0] < 3) { x[0]++; x[1] = 0; }

}

function warnAt() { var t = TIMER(); return t.total > 5 * 60000 ? 5 * 60000 : t.total / 3; }
function fmt(ms) { var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60); s %= 60; return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s; }

function tick() {

    if (left === null || t.locked) { p.remove(); return; }
    p.textContent = fmt(left); p.classList.toggle("warn", left <= warnAt() && left > 0);

  view = "result";
  $app.innerHTML = '<div class="screen result">' +
    '<img class="big" src="' + (newIsl ? IMG(D.ui.islands[island(c.stars).idx]) : M(G.first >= G.tasks.length - 2 ? "trophy" : "party_hat")) + '" alt="">' +
    "<h2>" + (newIsl ? "Новый остров: «" + esc(stripEmoji(island(c.stars).name)) + "»!" : "Игра пройдена" + (c.name ? ", " + esc(c.name) : "") + "!") + "</h2>" +
    '<div class="plus-stars num">+' + G.stars + ' <img src="' + IMG("03_ui/14_star") + '" alt=""></div>' +
    '<div class="stats"><div class="card stat"><b class="num">' + G.first + " / " + G.tasks.length + '</b><span>с первой попытки</span></div><div class="card stat"><b class="num">🔥 ' + c.streak + "</b><span>" + (c.streak === 1 ? "день" : "дня подряд") + "</span></div></div>" +
    (nx ? '<div class="card next" style="width:100%;text-align:left"><img src="' + IMG(D.ui.islands[nx.idx]) + '" alt=""><div><b>До острова «' + esc(stripEmoji(nx.name)) + '»</b><div class="bar"><i style="width:' + Math.round(100 * (c.stars - D.islands[nx.idx - 1][0]) / (nx.need - D.islands[nx.idx - 1][0])) + '%"></i></div><small class="num">ещё ' + (nx.need - c.stars) + " " + starWord(nx.need - c.stars) + "</small></div></div>" : "") +
    '<div style="width:100%;display:grid;gap:10px;margin-top:auto">' +
    (canPlay ? '<button class="btn-main" type="button" data-play>Ещё игра<small>осталось ' + (D.perDay - gamesToday()) + " на сегодня</small></button>" : '<p class="muted" style="font-size:15px">На сегодня всё — до завтра! 🦉</p>') +
    '<button class="btn-ghost" type="button" data-go="home">На главную</button></div></div>';
  play(newIsl ? D.say.island : D.say.done);
  G = null;
}

/* ---------- для взрослых ---------- */
function renderParents() {
  var c = core(), today = dayNum(), days = 0, total = 0, first = 0, per = {};
  var week = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"], cells = "";
  for (var d = today - 6; d <= today; d++) {
    var rec = S.stats[String(d)], played = rec && Object.keys(rec).length > 0;
    if (played) days++;
    var wd = new Date(d * DAY).getUTCDay(); // 0 — воскресенье
    cells += "<i" + (played ? ' class="on"' : "") + ">" + week[(wd + 6) % 7] + "</i>";
    if (rec) Object.keys(rec).forEach(function (b) { per[b] = per[b] || [0, 0]; per[b][0] += rec[b][0]; per[b][1] += rec[b][1]; total += rec[b][0]; first += rec[b][1]; });
  }
  var pct = total ? Math.round(100 * first / total) : 0;
  var rows = Object.keys(per).sort(function (a, b) { return per[b][0] - per[a][0]; }).map(function (b) {
    var p = Math.round(100 * per[b][1] / per[b][0]);
    return '<div class="trow' + (p < 60 ? " low" : "") + '"><span>' + esc(D.blocks[b]) + '</span><div class="bar"><i style="width:' + p + '%"></i></div><span class="num">' + p + "%</span></div>";
  }).join("");
  var weak = Object.keys(per).filter(function (b) { return per[b][0] >= 2 && per[b][1] / per[b][0] < 0.6; }).slice(0, 2);
  var tips = weak.map(function (b) { return '<div class="tip wide"><b>🎯 Потренируйте: ' + esc(D.blocks[b]) + "</b>" + esc(D.tips[b][0].toUpperCase() + D.tips[b].slice(1)) + ".</div>"; }).join("");
  var left = timerLeft(), tlabel = TIMER().locked ? "время вышло" : left !== null ? "осталось " + fmt(left) : "выключен";
  $app.innerHTML = '<div class="screen"><div><h2 style="font-size:22px">Для взрослых</h2><p class="muted">' + (c.name ? esc(c.name) + " · " : "") + "отчёт за последние 7 дней</p></div>" +
    '<div class="bento">' +
    '<div class="card"><div class="k">Дней с занятиями</div><div class="v num">' + days + ' / 7</div><div class="week">' + cells + "</div></div>" +
    '<div class="card"><div class="k">С первой попытки</div><div class="ring" style="background:conic-gradient(var(--tangerine) 0 ' + pct + '%, var(--surface-2) ' + pct + '% 100%)"><b class="num">' + pct + "%</b></div><div class=\"k num\" style=\"margin-top:6px\">заданий: " + total + "</div></div>" +
    (rows ? '<div class="card wide"><div class="k" style="margin-bottom:4px">По темам</div>' + rows + "</div>" : '<div class="card wide muted">Пока нет ответов за неделю. Начните с одной короткой игры — 10 минут.</div>') +
    tips +
    '<div class="card wide"><div class="setting"><span>⏱ Таймер занятия: ' + tlabel + '</span><button type="button" data-timer>Настроить</button></div>' +
    '<div class="setting"><span>🔊 Озвучка вопросов</span><button type="button" data-voice>' + (c.voice ? "Выключить" : "Включить") + "</button></div>" +
    '<div class="setting"><span>✏️ Имя: ' + (c.name ? esc(c.name) : "не указано") + '</span><button type="button" data-rename>Изменить</button></div>' +
    '<div class="setting"><span>🎮 Игр в день</span><span class="chip num" style="padding:4px 11px">' + D.perDay + "</span></div>" +
    '<div class="setting"><span>🗑 Начать заново</span><button type="button" data-reset>Сбросить</button></div></div>' +
    '<p class="muted wide">Сложность подстраивается сама по каждой теме. Хвалите за старание — это важнее правильных ответов 💛</p>' +
    "</div></div>" + tabbar();
}
function resetAll() {
  var l = layer('<h3>Сбросить весь прогресс?</h3><p>Звёзды, острова и статистика обнулятся. Отменить будет нельзя.</p><div class="gate" style="max-width:none;padding:0"></div><button class="btn-ghost" type="button" data-close>Отмена</button>');
  gate(l.querySelector(".gate"), "Подтвердите как взрослый:", function () {
    S.core = null; S.seen = []; S.stats = {}; KEYS.forEach(function (k) { if (k !== "timer") save(k); });
    l.remove(); view = "home"; render();
  });
}

/* ---------- события ---------- */
$app.addEventListener("click", function (e) {
  var el = e.target.closest("button"); if (!el) return;
  if (el.dataset.go) { if (view === "game") return; view = el.dataset.go; render(); return; }
  if ("play" in el.dataset) { startGame(); return; }
  if ("timer" in el.dataset) { openTimer(); return; }
  if ("speak" in el.dataset) { play(G && G.tasks[G.idx].qa); return; }
  if (el.dataset.ans !== undefined) { answer(+el.dataset.ans, el); return; }
  if ("quit" in el.dataset) {
    var l = layer("<h3>Выйти из игры?</h3><p>Звёзды за решённые задания сохранятся.</p><button class=\"btn-main\" type=\"button\" data-yes style=\"font-size:18px\">Выйти</button><button class=\"btn-ghost\" type=\"button\" data-close>Играть дальше</button>");
    l.querySelector("[data-yes]").onclick = function () { clearTimeout(G && G.memTimer); G = null; view = "home"; l.remove(); render(); };
    return;
  }
  if ("voice" in el.dataset) { core().voice = core().voice ? 0 : 1; save("core"); render(); return; }
  if ("rename" in el.dataset) { core().asked = 0; render(); return; }
  if ("reset" in el.dataset) { resetAll(); return; }
});
if (tg && tg.BackButton) tg.BackButton.onClick(function () { if (view !== "game") { view = "home"; render(); } });

/* ---------- запуск ---------- */
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor("#FEF7E8"); tg.setBackgroundColor("#FEF7E8"); } catch (e) {}
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
}
load(function () {
  if (TIMER().ends && Date.now() >= TIMER().ends) { TIMER().locked = 1; TIMER().ends = 0; save("timer"); }
  render();
  if (TIMER().locked) showLock();
  setInterval(tick, 1000);
});
})();
</script>
</body>
</html>
