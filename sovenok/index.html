<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Совёнок Тим</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Стиль — как у Академии Рыжика: светлый градиент с цветными пятнами и
   точечной сеткой, белые «парящие» карточки, яркие градиентные кнопки. */
:root {
  --bg-a: #EAF1FF; --bg-b: #FFF2E8; --card: #FFFFFF; --ink: #2E2A4A; --ink-soft: #6F6B8C;
  --coral: #FF7A66; --coral-deep: #E85B47; --sun: #FFB648; --sun-deep: #E89A1E;
  --leaf: #34C2A3; --leaf-deep: #22A387; --sky: #5AA9F0; --sky-deep: #3D8AD1;
  --violet: #8E6CFF; --violet-deep: #6A4BE8; --pink: #FF6FA8; --pink-deep: #E04C8A;
  --ok-soft: #DDF7EF; --bad-soft: #FFE3EC; --tile: #FEF7E8;
  --shadow-rgb: 46, 42, 90;
  --sh-s: 0 10px 22px -12px rgba(var(--shadow-rgb), .35), 0 1px 4px rgba(var(--shadow-rgb), .08);
  --sh-m: 0 18px 36px -18px rgba(var(--shadow-rgb), .45), 0 2px 8px rgba(var(--shadow-rgb), .07);
  --display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.4;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  background:
    radial-gradient(circle at 12% 8%, rgba(255,182,72,.22), transparent 52%),
    radial-gradient(circle at 88% 12%, rgba(90,169,240,.24), transparent 52%),
    radial-gradient(circle at 50% 105%, rgba(232,93,158,.16), transparent 58%),
    linear-gradient(180deg, var(--bg-a), var(--bg-b));
  background-attachment: fixed;
}
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(rgba(var(--shadow-rgb), .07) 1.2px, transparent 1.3px); background-size: 22px 22px; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky-deep); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; margin: 0; line-height: 1.1; text-wrap: balance; }
p { margin: 0; }
img { display: block; max-width: 100%; }
.num { font-variant-numeric: tabular-nums; }
.tile-img { border-radius: 18%; background: var(--tile); }

#app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
.screen { flex: 1; overflow-y: auto; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 22px; display: flex; flex-direction: column; gap: 16px; }

/* верхняя строка */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 6px 14px 6px 8px; font-family: var(--display); font-weight: 800; font-size: 18px; box-shadow: var(--sh-s); white-space: nowrap; }
.pill img { width: 26px; height: 26px; border-radius: 50%; }
.icon-btn { width: 46px; height: 46px; border-radius: 999px; background: var(--card); display: grid; place-items: center; box-shadow: var(--sh-s); flex: none; transition: transform .15s; }
.icon-btn img { width: 30px; height: 30px; border-radius: 50%; }
.icon-btn:active { transform: scale(.92); }
.tpill { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border-radius: 999px; padding: 7px 14px 7px 12px; font-family: var(--display); font-weight: 800; font-size: 17px; box-shadow: var(--sh-s); font-variant-numeric: tabular-nums; }
.tpill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--sky); }
.tpill.warn { color: var(--coral-deep); animation: blink 1s step-start infinite; }
.tpill.warn::before { background: var(--coral); }
@keyframes blink { 50% { opacity: .4; } }

/* совёнок и реплика */
.talk { display: flex; align-items: flex-end; gap: 10px; }
.talk .owl { width: 84px; height: 84px; flex: none; border-radius: 50%; box-shadow: var(--sh-s); }
.bubble { background: var(--card); border-radius: 22px 22px 22px 6px; padding: 13px 16px; font-weight: 800; font-size: 16px; box-shadow: var(--sh-s); flex: 1; }

/* главная */
.title h1 { font-size: 30px; }
.title p { color: var(--ink-soft); font-weight: 700; margin-top: 2px; }
.btn { width: 100%; border-radius: 26px; padding: 17px 16px; color: #fff; font-family: var(--display); font-weight: 800; font-size: 24px; display: grid; gap: 0; line-height: 1.1; transition: transform .12s, box-shadow .12s; }
.btn small { font-family: var(--body); font-weight: 800; font-size: 14px; opacity: .92; }
.btn:active { transform: translateY(3px) scale(.99); }
.btn:disabled { filter: grayscale(1); opacity: .55; }
.b-violet { background: linear-gradient(155deg, var(--violet), var(--violet-deep)); box-shadow: 0 18px 34px -16px rgba(106,75,232,.7), 0 2px 8px rgba(106,75,232,.2); }
.b-coral { background: linear-gradient(155deg, var(--coral), var(--coral-deep)); box-shadow: 0 18px 34px -16px rgba(232,91,71,.65); }
.b-leaf { background: linear-gradient(155deg, var(--leaf), var(--leaf-deep)); box-shadow: 0 18px 34px -16px rgba(34,163,135,.6); }
.b-sun { background: linear-gradient(155deg, var(--sun), var(--sun-deep)); box-shadow: 0 18px 34px -16px rgba(219,150,12,.6); }
.b-sky { background: linear-gradient(155deg, var(--sky), var(--sky-deep)); box-shadow: 0 18px 34px -16px rgba(61,138,209,.6); }
.btn-white { width: 100%; background: var(--card); border-radius: 22px; padding: 15px; font-family: var(--display); font-weight: 800; font-size: 19px; box-shadow: var(--sh-s); }
.hero-card { position: relative; width: 100%; border-radius: 30px; padding: 22px 20px; color: #fff; overflow: hidden; min-height: 170px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; gap: 4px; }
.hero-card .owl { position: absolute; right: -6px; bottom: -6px; width: 150px; height: 150px; border-radius: 50%; box-shadow: 0 0 0 6px rgba(255,255,255,.35); }
.hero-card h2 { font-size: 34px; max-width: 58%; }
.hero-card p { font-weight: 800; opacity: .95; max-width: 52%; line-height: 1.25; }
.row-info { display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 800; color: var(--ink-soft); padding: 0 4px; }
.dots { display: flex; gap: 6px; }
.dots i { width: 13px; height: 13px; border-radius: 50%; background: var(--violet); }
.dots i.off { background: rgba(var(--shadow-rgb), .13); }
.card { background: var(--card); border-radius: 26px; padding: 16px; box-shadow: var(--sh-m); }
.next { display: grid; grid-template-columns: 70px 1fr; gap: 14px; align-items: center; }
.next img { width: 70px; height: 70px; }
.next b { font-family: var(--display); font-size: 19px; }
.bar { height: 12px; background: rgba(var(--shadow-rgb), .08); border-radius: 99px; overflow: hidden; margin-top: 7px; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--coral)); border-radius: 99px; }
.next small { display: block; color: var(--ink-soft); font-weight: 800; margin-top: 5px; }

/* таббар */
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 12px calc(10px + env(safe-area-inset-bottom, 0px)); padding: 8px; background: rgba(255,255,255,.92); border-radius: 26px; box-shadow: var(--sh-m); backdrop-filter: blur(8px); }
.tab { display: grid; justify-items: center; gap: 2px; font-size: 13px; font-weight: 900; color: var(--ink-soft); padding: 6px 0; border-radius: 18px; }
.tab img { width: 32px; height: 32px; border-radius: 10px; }
.tab.on { color: #fff; background: linear-gradient(155deg, var(--violet), var(--violet-deep)); box-shadow: 0 10px 20px -12px rgba(106,75,232,.8); }

/* карта: тропинка снизу вверх, острова слева и справа */
.mapbox { flex: none; position: relative; border-radius: 30px; overflow: hidden; box-shadow: var(--sh-m);
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.75) 0 46px, transparent 47px),
    radial-gradient(circle at 26% 10%, rgba(255,255,255,.75) 0 34px, transparent 35px),
    radial-gradient(circle at 82% 38%, rgba(255,255,255,.7) 0 40px, transparent 41px),
    radial-gradient(circle at 74% 40%, rgba(255,255,255,.7) 0 28px, transparent 29px),
    radial-gradient(circle at 15% 70%, rgba(255,255,255,.65) 0 36px, transparent 37px),
    linear-gradient(180deg, #CFE6FF 0%, #E3F1FF 45%, #D9F5EA 100%); }
.mapbox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.isle { position: absolute; width: 150px; transform: translate(-50%, -50%); display: grid; justify-items: center; gap: 4px; text-align: center; }
.isle img.i { width: 118px; height: 118px; border-radius: 50%; box-shadow: 0 12px 22px -12px rgba(var(--shadow-rgb), .5); }
.isle b { font-family: var(--display); font-size: 16px; line-height: 1.05; background: var(--card); border-radius: 999px; padding: 4px 12px; box-shadow: var(--sh-s); }
.isle small { font-weight: 900; font-size: 12px; color: var(--ink-soft); }
.isle.closed img.i { filter: grayscale(1); opacity: .55; }
.isle.closed b { color: var(--ink-soft); }
.isle.now img.i { width: 134px; height: 134px; box-shadow: 0 0 0 5px var(--sun), 0 0 0 11px rgba(255,182,72,.35), var(--sh-m); }
.isle.done img.i { box-shadow: 0 0 0 4px var(--leaf), var(--sh-s); }
.isle .owlmark { position: absolute; width: 70px; height: 70px; right: -6px; top: -26px; border-radius: 50%; box-shadow: var(--sh-s); animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
/* игра */
.game-top { display: flex; gap: 8px; align-items: center; } .game-top .pebbles { flex: 1; }
.pebbles { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; }
.pebbles i { height: 11px; border-radius: 99px; background: rgba(var(--shadow-rgb), .12); }
.pebbles i.ok { background: var(--leaf); }
.pebbles i.half { background: var(--sun); }
.pebbles i.bad { background: var(--pink); }
.pebbles i.now { background: var(--violet); }
.q { background: var(--card); border-radius: 30px; padding: 16px; box-shadow: var(--sh-m); display: grid; gap: 12px; }
.badge { justify-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: 999px; color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; background: linear-gradient(155deg, var(--violet), var(--violet-deep)); }
.badge img { width: 20px; height: 20px; border-radius: 6px; }
.pic { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.pic .main { width: 168px; height: 168px; }
.pic .seq { width: 56px; height: 56px; }
.pic .grp { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; background: var(--tile); border-radius: 20px; padding: 10px; max-width: 46%; }
.pic .grp img { width: 46px; height: 46px; }
.pic .plus { font-family: var(--display); font-size: 34px; color: var(--violet); }
.pic .remember { width: 100%; text-align: center; font-family: var(--display); font-size: 22px; font-weight: 800; }
.pic .emojirow { font-size: 40px; letter-spacing: 6px; }
.qtext { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.15; text-align: center; overflow-wrap: break-word; hyphens: auto; -webkit-hyphens: auto; }
.q > *, .screen > * { min-width: 0; max-width: 100%; }
.screen { overflow-x: hidden; }
.speak { justify-self: center; display: inline-flex; align-items: center; gap: 8px; background: var(--card); border-radius: 99px; padding: 6px 16px 6px 6px; font-weight: 900; font-size: 15px; box-shadow: var(--sh-s); }
.speak i { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; } .speak i img { width: 34px; height: 34px; }
.speak.on i { animation: pulse 1s ease-in-out 2; }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(90,169,240,.25); } }

/* ответы: белые кнопки с картинкой */
.answers { display: grid; gap: 12px; }
.answers.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.answers.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .answers.cols-3 .ans { font-size: 14px; padding: 8px; border-radius: 22px; } .ans span { min-width: 0; max-width: 100%; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; }
.ans { position: relative; background: var(--card); border-radius: 24px; box-shadow: var(--sh-m); padding: 10px; display: grid; justify-items: center; align-items: center; gap: 6px; font-weight: 900; font-size: 17px; line-height: 1.15; text-align: center; transition: transform .12s, box-shadow .2s, opacity .2s; }
.ans img { width: 100%; max-width: 130px; aspect-ratio: 1; }
.ans.row { grid-template-columns: 78px 1fr; justify-items: start; text-align: left; padding: 8px 14px 8px 8px; }
.ans.row img { width: 78px; }
.ans:active { transform: scale(.96); }
.ans.right { box-shadow: 0 0 0 4px var(--leaf), var(--sh-m); background: var(--ok-soft); }
.ans.wrong { box-shadow: 0 0 0 4px var(--pink), var(--sh-s); background: var(--bad-soft); opacity: .55; animation: shake .35s; }
.ans.reveal { box-shadow: 0 0 0 4px var(--leaf), var(--sh-m); }
.ans.picked { box-shadow: 0 0 0 4px var(--violet), var(--sh-m); }
.ans .nbadge { position: absolute; top: 6px; left: 6px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 800; font-size: 20px; background: linear-gradient(155deg, var(--sun), var(--sun-deep)); box-shadow: var(--sh-s); z-index: 1; }
.ans.row .nbadge { top: 50%; transform: translateY(-50%); left: auto; right: 12px; }
.ans .mark { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 15px; background: rgba(var(--shadow-rgb), .15); }
.ans.picked .mark { background: var(--violet); }
.ans.right .mark { background: var(--leaf); }
.ans.wrong .mark { background: var(--pink); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.ans.done { opacity: .35; pointer-events: none; }

/* по порядку */
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.slot { width: 66px; display: grid; justify-items: center; gap: 3px; }
.slot .box { width: 66px; height: 66px; border-radius: 18px; border: 2.5px dashed rgba(var(--shadow-rgb), .2); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 22px; color: rgba(var(--shadow-rgb), .3); }
.slot .box img { width: 100%; height: 100%; }
.slot.filled .box { border: 0; animation: pop .3s; }
.slot small { font-size: 11px; font-weight: 900; color: var(--ink-soft); width: 66px; text-align: center; line-height: 1.1; min-height: 1.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } }
/* пары */
.match { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.match .col { display: grid; gap: 10px; align-content: start; }
.match .ans { grid-template-columns: 58px 1fr; justify-items: start; text-align: left; padding: 6px 10px 6px 6px; font-size: 15px; border-radius: 20px; }
.match .ans img { width: 58px; }
.match .ans.paired { box-shadow: 0 0 0 4px var(--leaf), var(--sh-s); background: var(--ok-soft); pointer-events: none; }

.say { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: end; }
.say img { width: 62px; height: 62px; border-radius: 50%; box-shadow: var(--sh-s); }
.say p { background: var(--card); border-radius: 20px 20px 20px 4px; padding: 11px 14px; font-weight: 800; font-size: 15px; line-height: 1.3; box-shadow: var(--sh-s); }
.say p b { color: var(--violet-deep); }
.hint-btns { display: flex; gap: 8px; margin-top: 10px; }
.hint-btns button { flex: 1; border-radius: 999px; padding: 10px 12px; font-weight: 900; font-size: 16px; background: rgba(var(--shadow-rgb), .07); }
.back-fab { position: fixed; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20; display: grid; justify-items: center; gap: 0; width: 76px; padding: 6px 0 8px; border-radius: 26px; background: #fff; box-shadow: var(--sh-m); }
.back-fab img { width: 48px; height: 48px; transform: scaleX(-1); border-radius: 12px; }
.back-fab span { font-weight: 900; font-size: 13px; color: #3f9a2a; line-height: 1; }
.back-fab:active { transform: scale(.94); }
.screen:has(.back-fab) { padding-bottom: 110px; }
.sort-item { display: grid; justify-items: center; gap: 6px; text-align: center; }
.sort-item .tile-img.main { width: 180px; height: 180px; }
.sort-item b { font-family: var(--display); font-size: 24px; }
.sort-done { display: grid; gap: 10px; }
.sort-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.sort-row .tile-img { width: 54px; height: 54px; }
.why-btns button { background: #fff; color: var(--violet-deep); box-shadow: var(--sh-s); }
.why-btns button[data-next] { background: linear-gradient(155deg, var(--violet), var(--violet-deep)); color: #fff; }
.hint-btns button[data-hint="yes"] { background: linear-gradient(155deg, var(--sun), var(--sun-deep)); color: #fff; }
.say.good p { background: linear-gradient(155deg, var(--leaf), var(--leaf-deep)); color: #fff; }
.say.good p b { color: #fff; }

/* финал */
.result { align-items: center; text-align: center; }
.result .big { width: 200px; height: 200px; border-radius: 50%; box-shadow: var(--sh-m); margin-top: 6px; }
.result h2 { font-size: 30px; }
.plus-stars { font-family: var(--display); font-weight: 800; font-size: 54px; color: var(--sun-deep); display: flex; align-items: center; gap: 8px; line-height: 1; }
.plus-stars img { width: 54px; height: 54px; border-radius: 50%; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.stat b { font-family: var(--display); font-size: 28px; display: block; line-height: 1.1; }
.stat span { font-size: 13px; font-weight: 800; color: var(--ink-soft); }

/* для взрослых */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.bento .wide { grid-column: 1 / -1; }
.k { font-size: 13px; font-weight: 900; color: var(--ink-soft); }
.v { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1.05; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 8px; }
.week i { aspect-ratio: 1; border-radius: 50%; background: rgba(var(--shadow-rgb), .08); font-style: normal; font-size: 10px; font-weight: 900; display: grid; place-items: center; color: var(--ink-soft); }
.week i.on { background: linear-gradient(155deg, var(--leaf), var(--leaf-deep)); color: #fff; }
.ring { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; margin-top: 6px; }
.ring b { width: 56px; height: 56px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-weight: 900; font-size: 16px; }
.trow { display: grid; grid-template-columns: 1fr 76px 42px; gap: 8px; align-items: center; font-size: 14px; font-weight: 800; padding: 5px 0; }
.trow .bar { margin: 0; height: 9px; }
.trow .bar > i { background: linear-gradient(90deg, var(--leaf), var(--leaf-deep)); }
.trow.low .bar > i { background: linear-gradient(90deg, var(--pink), var(--coral)); }
.trow span:last-child { text-align: right; color: var(--ink-soft); }
.tip { background: linear-gradient(155deg, #EAF4FF, #F3EEFF); border-radius: 22px; padding: 14px; font-size: 14px; font-weight: 700; line-height: 1.4; }
.tip b { display: block; font-weight: 900; margin-bottom: 2px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; padding: 8px 0; border-bottom: 1.5px solid rgba(var(--shadow-rgb), .07); }
.setting:last-child { border-bottom: 0; }
.setting button.s { background: rgba(var(--shadow-rgb), .07); border-radius: 999px; padding: 8px 14px; font-weight: 900; font-size: 14px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: rgba(var(--shadow-rgb), .07); border-radius: 999px; padding: 4px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; background: var(--card); font-weight: 900; font-size: 20px; box-shadow: var(--sh-s); }
.stepper b { min-width: 28px; text-align: center; font-family: var(--display); font-size: 20px; }
.muted { color: var(--ink-soft); font-size: 13px; font-weight: 700; }

/* звание, награды, выпускной */
.rank { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 5px 12px 5px 6px; border-radius: 999px; background: linear-gradient(155deg, var(--sun), var(--sun-deep)); color: #fff; font-weight: 900; font-size: 14px; box-shadow: var(--sh-s); }
.rank img { width: 24px; height: 24px; border-radius: 50%; }

  Array.prototype.forEach.call(document.querySelectorAll("[data-tpill]"), function (p) {
    if (left === null || t.locked) { p.remove(); return; }
    p.textContent = fmt(left); p.classList.toggle("warn", left <= warnAt() && left > 0);
  });
  if (left === null || t.locked) return;
  if (left <= warnAt() && left > 0 && !t.warned) {
    t.warned = 1; save("timer");
    toast("⏰ Осталось " + (t.total > 5 * 60000 ? "5 минут" : "совсем чуть-чуть") + "! Скоро Тим полетит отдыхать.");
    play(D.say.warn);
  }
  if (left <= 0) { t.locked = 1; t.ends = 0; save("timer"); showLock(); }
}

/* ---------- вопрос для взрослого ---------- */
function gate(box, title, onPass) {
  var ex;
  function fresh() { var a = 6 + Math.floor(Math.random() * 4), b = 6 + Math.floor(Math.random() * 4); ex = { q: a + " × " + b + " = ?", a: a * b }; }
  fresh();
  box.innerHTML = "<b>" + esc(title) + '</b><div class="ex num">' + ex.q + '</div><input type="text" inputmode="numeric" autocomplete="off" aria-label="Ответ взрослого"><div class="err" aria-live="polite"></div><button class="btn b-violet" type="button" style="font-size:20px">Проверить</button>';
  var input = box.querySelector("input");
  function check() {
    if (parseInt(input.value, 10) === ex.a) { onPass(); return; }
    fresh(); box.querySelector(".ex").textContent = ex.q;
    box.querySelector(".err").textContent = "Неверно — вот другой пример.";
    input.value = ""; input.focus(); haptic("error");
  }
  box.querySelector("button").addEventListener("click", check);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
  setTimeout(function () { input.focus(); }, 50);
}
function layer(html) {
  closeLayers();
  var l = document.createElement("div"); l.className = "layer"; l.innerHTML = '<div class="sheet">' + html + "</div>";
  l.addEventListener("click", function (e) { if (e.target === l || e.target.closest("[data-close]")) l.remove(); });
  document.body.appendChild(l); return l;
}
function closeLayers() { Array.prototype.forEach.call(document.querySelectorAll(".layer"), function (n) { n.remove(); }); }
function adultLayer(title, onPass) {
  var l = layer("<h3>Для взрослых</h3>" + '<div class="gate" style="max-width:none;box-shadow:none;padding:0"></div><button class="btn-white" type="button" data-close>Отмена</button>');
  gate(l.querySelector(".gate"), title, function () { l.remove(); onPass(); });
}
function toast(text) {
  var t = document.createElement("div"); t.className = "toast"; t.textContent = text;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 4500);
}

function openTimer() {
  if (TIMER().locked) { showLock(); return; }
  var running = timerLeft() !== null;
  var cur = running ? Math.round(TIMER().total / 60000) : 0;
  var l = layer('<h3>⏱ Таймер занятия</h3><p>Отсчёт начнётся сразу. За 5 минут Тим предупредит, а когда время выйдет — игра остановится до разрешения взрослого.' +
    (running ? " <b>Сейчас осталось " + fmt(timerLeft()) + ".</b>" : "") + "</p>" +
    '<div class="mins">' + [10, 15, 20, 30].map(function (m) { return '<button type="button" data-min="' + m + '"' + (cur === m ? ' class="on"' : "") + ">" + m + " мин</button>"; }).join("") +
    '<button type="button" class="wide' + (!running ? " on" : "") + '" data-min="0">Без таймера</button></div>' +
    '<button class="btn-white" type="button" data-close>Закрыть</button>');
  l.addEventListener("click", function (e) {
    var b = e.target.closest("[data-min]"); if (!b) return;
    var min = +b.dataset.min;
    if (running) {
      var sheet = l.querySelector(".sheet"), box = document.createElement("div");
      box.className = "gate"; box.style.cssText = "max-width:none;box-shadow:none;padding:0"; sheet.innerHTML = ""; sheet.appendChild(box);

function tapPart(i) { var st = G.cur; if (st.done) return; if (st.picked[i]) delete st.picked[i]; else st.picked[i] = 1; renderTask(true); }
function partsDone() {
  var t = G.tasks[G.idx], st = G.cur;

function answer(i, btn) {

function finishTask(result, stars, text, pose, good) {

    G.stars += stars; if (result === 2) G.first++;

function renderParents() {

  for (var d = today - 6; d <= today; d++) {
    var rec = S.stats[String(d)], played = rec && Object.keys(rec).length > 0;
    if (played) days++;
    var wd = new Date(d * DAY).getUTCDay();
    cells += "<i" + (played ? ' class="on"' : "") + ">" + week[(wd + 6) % 7] + "</i>";
    if (rec) Object.keys(rec).forEach(function (b) { per[b] = per[b] || [0, 0]; per[b][0] += rec[b][0]; per[b][1] += rec[b][1]; total += rec[b][0]; first += rec[b][1]; });
  }
  var pct = total ? Math.round(100 * first / total) : 0;
  var rows = Object.keys(per).sort(function (a, b) { return per[b][0] - per[a][0]; }).map(function (b) {
    var p = Math.round(100 * per[b][1] / per[b][0]);
    return '<div class="trow' + (p < 60 ? " low" : "") + '"><span>' + esc(D.blocks[b]) + '</span><div class="bar"><i style="width:' + p + '%"></i></div><span class="num">' + p + "%</span></div>";
  }).join("");
  var weak = Object.keys(per).filter(function (b) { return per[b][0] >= 2 && per[b][1] / per[b][0] < 0.6; }).slice(0, 2);
  var tips = weak.map(function (b) { return '<div class="tip wide"><b>🎯 Потренируйте: ' + esc(D.blocks[b]) + "</b>" + esc(D.tips[b][0].toUpperCase() + D.tips[b].slice(1)) + ".</div>"; }).join("");
  var left = timerLeft(), tlabel = TIMER().locked ? "время вышло" : left !== null ? "осталось " + fmt(left) : "выключен";
  $app.innerHTML = '<div class="screen"><div><h1 style="font-size:28px">Для взрослых</h1><p class="muted">' + (c.name ? esc(c.name) + " · " : "") + "отчёт за последние 7 дней</p></div>" +
    readinessHtml() +
    '<div class="bento">' +
    '<div class="card"><div class="k">Дней с занятиями</div><div class="v num">' + days + ' / 7</div><div class="week">' + cells + "</div></div>" +
    '<div class="card"><div class="k">С первой попытки</div><div class="ring" style="background:conic-gradient(var(--violet) 0 ' + pct + '%, rgba(46,42,90,.08) ' + pct + '% 100%)"><b class="num">' + pct + "%</b></div><div class=\"k num\" style=\"margin-top:6px\">заданий: " + total + "</div></div>" +
    (rows ? '<div class="card wide"><div class="k" style="margin-bottom:4px">По темам</div>' + rows + "</div>" : '<div class="card wide muted">Пока нет ответов за неделю. Начните с одной короткой игры — 10 минут.</div>') +
    tips +
    '<div class="card wide">' +
    (ADMIN ? '<div class="setting"><span>🎮 Игр в день</span><span class="chip num" style="font-weight:900">без ограничений (вы админ)</span></div>' : '<div class="setting"><span>🎮 Игр в день</span><span class="stepper"><button type="button" data-perday="-1" aria-label="Меньше">−</button><b class="num">' + perDay() + '</b><button type="button" data-perday="1" aria-label="Больше">+</button></span></div>') +
    '<div class="setting"><span>⏱ Таймер: ' + tlabel + '</span><button class="s" type="button" data-timer>Настроить</button></div>' +
    '<div class="setting"><span>🔊 Озвучка</span><button class="s" type="button" data-voice>' + (c.voice ? "Выключить" : "Включить") + "</button></div>" +
    '<div class="setting"><span>✏️ Имя: ' + (c.name ? esc(c.name) : "не указано") + '</span><button class="s" type="button" data-rename>Изменить</button></div>' +
    (ADMIN ? "" : '<div class="setting"><span>🔑 Режим проверки</span><button class="s" type="button" data-admcode>Ввести код</button></div>') +
    (ADMIN ? '<div class="setting"><span>📋 Все задания (проверка)</span><button class="s" type="button" data-cat="">Открыть</button></div>' : "") +
    (ADMIN ? '<div class="setting"><span>🎓 Выпускной (проверка)</span><button class="s" type="button" data-gradpreview>Показать</button></div>' : "") +
    '<div class="setting"><span>🗑 Начать заново</span><button class="s" type="button" data-reset>Сбросить</button></div></div>' +
    '<p class="muted wide" style="font-size:12px">Версия ' + esc(D.build || "?") + " · ID " + (TG_ID || "нет") + " · проверка: " + (ADMIN ? "включена" : "выключена") + "</p>" +
    '<p class="muted wide">Сложность подстраивается сама по каждой теме. Хвалите за старание — это важнее правильных ответов 💛</p>' +
    "</div></div>" + tabbar();
}
function changePerDay(delta) {
  var next = Math.max(1, Math.min(10, perDay() + delta));
  if (next === perDay()) return;
  adultLayer("Изменить количество игр в день может только взрослый:", function () { core().perDay = next; save("core"); render(); });
}
function resetAll() {
  adultLayer("Сбросить звёзды, острова и статистику? Подтвердите:", function () {
    S.core = null; S.seen = []; S.stats = {}; KEYS.forEach(function (k) { if (k !== "timer") save(k); });
    view = "home"; render();
  });
}

/* ---------- события ---------- */
$app.addEventListener("click", function (e) {
  var md = e.target.closest("[data-medal]");
  if (md) {
    var mm = D.medals.filter(function (m) { return m[0] === md.dataset.medal; })[0];
    if (mm) play(medalsGot()[mm[0]] ? mm[5] : mm[6]);
    return;
  }
  if (e.target.closest("[data-sayitem]") && G && G.cur) { var Ts = G.tasks[G.idx]; play(Ts.ia && Ts.ia[G.cur.ord[G.cur.k]]); return; }
  if (e.target.closest("[data-ranknow]")) { playNamed(D.rankNow[rankIdx()]); return; }
  var isle = ADMIN && e.target.closest("[data-isle]");
  if (isle) {
    // Админ: перелететь на любой остров (звёзд становится ровно на этот остров).
    var ii = +isle.dataset.isle, need = D.islands[ii][0];
    var l = layer("<h3>Перелететь на остров «" + esc(stripEmoji(D.islands[ii][1])) + "»?</h3><p>Для проверки: звёзд станет " + need + ". Это меняет только ваш прогресс.</p>" +
      '<button class="btn b-violet" type="button" data-yes style="font-size:20px">Перелететь</button><button class="btn-white" type="button" data-close>Отмена</button>');
    l.querySelector("[data-yes]").onclick = function () { core().stars = need; save("core"); l.remove(); render(); };
    return;
  }
  var el = e.target.closest("button"); if (!el || el.disabled) return;
  var ds = el.dataset;
  if (ds.go) { if (view === "game") return; view = ds.go; render(); return; }
  if ("play" in ds) { startGame(); return; }
  if ("timer" in ds) { openTimer(); return; }
  if ("speak" in ds) { play(G && G.tasks[G.idx].qa); return; }
  if (G && TIMER().locked && (ds.ans || ds.ord || ds.ml || ds.mr || ds.part || ds.srt || "partsdone" in ds)) { showLock(); return; }
  var T = G && G.tasks[G.idx];
  if (ds.ans !== undefined) { withLead(T.oa && T.oa[+ds.ans], function () { answer(+ds.ans, el); }); return; }
  if (ds.ord !== undefined) { withLead(T.ia && T.ia[+ds.ord], function () { tapOrder(+ds.ord, el); }); return; }
  if (ds.ml !== undefined) { withLead(T.pa && T.pa[+ds.ml][0], function () { tapMatchLeft(+ds.ml); }); return; }
  if (ds.mr !== undefined) { withLead(T.pa && T.pa[+ds.mr][1], function () { tapMatchRight(+ds.mr, el); }); return; }
  if (ds.part !== undefined) { withLead(T.ia && T.ia[+ds.part], function () { tapPart(+ds.part); }); return; }
  if ("partsdone" in ds) { partsDone(); return; }
  if (ds.srt !== undefined) { withLead(T.ca && T.ca[+ds.srt], function () { tapSort(+ds.srt, el); }); return; }
  if ("why" in ds && T && T.w) { G.waitWhy = true; sayHtml("<b>Почему?</b> " + esc(T.w) + whyBtns(true), "reading", false); play(T.wa); return; }
  if ("next" in ds) { stopVoice(); nextTask(); return; }
  if ("back" in ds && G && G.idx > 0) {
    // Назад: предыдущее задание заново, без повторных звёзд.
    stopVoice(); clearTimeout(G.memTimer);
    G.idx--; (G.replay = G.replay || {})[G.idx] = true; G.cur = null;
    renderTask(); var sc = document.querySelector(".screen"); if (sc) sc.scrollTop = 0;
    return;
  }
  if (ds.hint === "yes") { sayHtml("<b>Подсказка:</b> " + esc(T.h), "hint_point", false); play(T.ha); return; }
  if (ds.hint === "no") { sayHtml("<b>Хорошо!</b> Попробуй ещё раз сам.", "jump_joy", false); play(D.say.try_again); return; }
  if ("quit" in ds) {
    var l = layer("<h3>Выйти из игры?</h3><p>Звёзды за решённые задания сохранятся.</p><button class=\"btn b-coral\" type=\"button\" data-yes style=\"font-size:20px\">Выйти</button><button class=\"btn-white\" type=\"button\" data-close>Играть дальше</button>");
    l.querySelector("[data-yes]").onclick = function () { clearTimeout(G && G.memTimer); G = null; view = "home"; l.remove(); render(); };
    return;
  }
  if (ds.perday) { changePerDay(+ds.perday); return; }
  if ("sound" in ds) { core().voice = core().voice ? 0 : 1; save("core"); if (!core().voice) { try { player.pause(); } catch (e) {} } el.outerHTML = soundBtn(); return; }
  if ("voice" in ds) { core().voice = core().voice ? 0 : 1; save("core"); render(); return; }
  if ("rename" in ds) { core().asked = 0; render(); return; }
  if ("reset" in ds) { resetAll(); return; }
  if ("diploma" in ds) { sendDiploma(); return; }
  if (ds.gift !== undefined) { var url = new URL(D.gifts[+ds.gift], location.href).href; try { tg.openLink(url); } catch (e) { window.open(url, "_blank"); } return; }
  if ("gradpreview" in ds) { renderGraduation(); return; }
  if (ds.cat !== undefined) { catBlock = ds.cat || null; view = "catalog"; render(); var s2 = document.querySelector(".screen"); if (s2) s2.scrollTop = 0; return; }
  if (ds.checktask) { checkGame(ds.checktask); return; }
  if ("admcode" in ds) {
    var lc = layer('<h3>Код проверки</h3><p>Включает режим проверки: все задания, карта и без лимита игр.</p>' +
      '<input class="name-input" type="text" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="Код" data-codein style="width:100%;box-sizing:border-box;padding:12px;border:2px solid rgba(110,90,200,.3);border-radius:16px;text-align:center;font-size:24px;font-weight:800;margin:10px 0">' +
      '<button class="btn b-violet" type="button" data-yes style="font-size:20px">Включить</button><button class="btn-white" type="button" data-close>Отмена</button>');
    var inp = lc.querySelector("[data-codein]"); inp.focus();
    lc.querySelector("[data-yes]").onclick = function () {
      var h = sha256("code:" + inp.value.trim());
      if (D.adminCodes && D.adminCodes.indexOf(h) >= 0) {
        core().adm = h; save("core"); try { localStorage.setItem("tim_adm", h); } catch (e) {}
        ADMIN = true; lc.remove(); render();
      } else { inp.value = ""; inp.placeholder = "Неверный код"; haptic("error"); }
    };
    return;
  }
});

/* ---------- админ: все задания по темам (проверка) ---------- */
var catBlock = null;
var MECH = { order: "по порядку", match: "найди пару", parts: "выбери всё", sort: "разложи", quiz: "выбор ответа" };
function renderCatalog() {
  var html;
  if (!catBlock) {
    html = Object.keys(D.blocks).map(function (b) {
      var n = (BY_BLOCK[b] || []).length;
      return '<div class="setting"><span>' + esc(D.blocks[b]) + ' <small class="muted">· ' + n + '</small></span><button class="s" type="button" data-cat="' + b + '">Открыть</button></div>';
    }).join("");
  } else {
    var list = (BY_BLOCK[catBlock] || []).slice().sort(function (a, b) { return a.l - b.l || (a.id < b.id ? -1 : 1); });
    html = '<div class="setting"><span><b>' + esc(D.blocks[catBlock]) + '</b></span><button class="s" type="button" data-checktask="block:' + catBlock + '">Пройти все подряд</button></div>' +
      list.map(function (t) {
        return '<div class="setting"><span style="font-size:15px"><small class="muted">ур. ' + t.l + " · " + esc(MECH[t.m] || t.m) + "</small><br>" + esc(t.q) + '</span><button class="s" type="button" data-checktask="' + t.id + '">▶</button></div>';
      }).join("") +
      '<button class="btn-white" type="button" data-cat="">← Все темы</button>';
  }
  $app.innerHTML = '<div class="screen"><div class="top"><h1 style="font-size:28px">Все задания</h1><span class="pill num">' + D.tasks.length + '</span></div>' +
    '<p class="muted">Проверка для админа: любое задание сразу, без звёзд и без лимита.</p><div class="card">' + html + "</div></div>" + tabbar();
}
// Задание из списка (или вся тема подряд): звёзды и статистика не меняются.
function checkGame(key) {
  var list;
  if (key.indexOf("block:") === 0) {
    list = (BY_BLOCK[key.slice(6)] || []).slice().sort(function (a, b) { return a.l - b.l || (a.id < b.id ? -1 : 1); });
  } else {
    var t0 = D.tasks.filter(function (t) { return t.id === key; })[0], same = BY_BLOCK[t0.b].slice().sort(function (a, b) { return a.l - b.l || (a.id < b.id ? -1 : 1); });
    list = same.slice(same.indexOf(t0));  // с выбранного и дальше по теме
  }
  var replay = {}; list.forEach(function (_, i) { replay[i] = true; });
  G = { tasks: list, idx: 0, marks: [], stars: 0, first: 0, starsBefore: core().stars, replay: replay, check: true };
  view = "game";
  renderTask(true);
  if (!list[0].sh) sayTask(list[0]);
}
if (tg && tg.BackButton) tg.BackButton.onClick(function () { if (view !== "game") { view = "home"; render(); } });

/* ---------- запуск ---------- */
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}
  try { tg.setHeaderColor("#EAF1FF"); tg.setBackgroundColor("#EAF1FF"); } catch (e) {}
  try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
}
load(function () {
  if (TIMER().ends && Date.now() >= TIMER().ends) { TIMER().locked = 1; TIMER().ends = 0; save("timer"); }
  render();
  if (TIMER().locked) showLock();
  setInterval(tick, 1000);
});
})();
</script>
</body>
